<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WhatsApp</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#25D366" id="themeColorMeta" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2325D366'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- CSS base (crítico para carregamento inicial) -->
  <style>
    :root { --theme:#25D366; --theme-dark:#128C7E; --theme-rgb:37,211,102; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; background:#08080a; overflow-x:hidden; }
    body { font-family:'Outfit',sans-serif; color:#fff; min-height:100dvh; display:flex; justify-content:center; -webkit-font-smoothing:antialiased; }
    .reception-body {
      background:
        radial-gradient(600px circle at 0% 0%, rgba(var(--theme-rgb),.15), transparent 40%),
        radial-gradient(800px circle at 100% 100%, rgba(var(--theme-rgb),.08), transparent),
        #08080a;
    }
    .reception-page {
      width:100%; max-width:480px; min-height:100dvh; margin:0 auto;
      background:#111113; position:relative; display:flex; flex-direction:column;
    }
    @media(min-width:600px) {
      .reception-page { margin:32px auto; min-height:auto; border-radius:32px; border:1px solid rgba(255,255,255,.06); box-shadow:0 20px 80px rgba(0,0,0,.6); }
    }
    .loading-placeholder { position:relative; overflow:hidden; background:#1a1a1e!important; color:transparent!important; }
    .loading-placeholder::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent); transform:translateX(-100%); animation:shimmer 1.2s infinite; }
    @keyframes shimmer { to { transform:translateX(100%); } }
  </style>
</head>
<body class="reception-body">
  <main class="reception-page theme-verde" id="container">
    <!-- Camadas de efeito -->
    <div class="fog-layer" aria-hidden="true"></div>
    <div class="dust-layer" aria-hidden="true"></div>

    <!-- Cabeçalho -->
    <div class="header-visual" id="headerVisual">
      <div class="banner-image" id="bannerDiv" style="display:none"><img id="bannerImg" src="" alt="Banner" /></div>
      <div class="logo-banner" id="logoBannerDiv" style="display:none"><img id="logoBannerImg" src="" alt="Logo" /><div class="glass-overlay"></div></div>
      <div class="color-banner" id="colorBannerDiv" style="display:none"><span class="material-icons-round">storefront</span></div>
    </div>

    <!-- Conteúdo -->
    <section class="reception-content">
      <div class="logo-circle" id="logoCircle" style="display:none"><img id="logoCircleImg" src="" alt="Logo" /></div>
      <div class="avatar-circle loading-placeholder" id="avatarCircle"><span id="avatarLetter"></span></div>
      <h1 class="company-name loading-placeholder" id="empresaNome"></h1>
      <p class="company-desc" id="descricaoTexto" style="display:none"></p>
      <div class="divider" id="divider" style="display:none"></div>

      <button id="whatsappBtn" type="button" class="whatsapp-btn loading-placeholder"><span class="whatsapp-icon"><i class="fab fa-whatsapp"></i></span><span id="whatsappBtnText"></span><span class="btn-shine"></span></button>
      <button id="whatsappBtn2" type="button" class="whatsapp-btn secondary" style="display:none"><span class="whatsapp-icon"><i class="fab fa-whatsapp"></i></span><span id="whatsappBtn2Text"></span></button>

      <div class="social-links" id="socialLinks" style="display:none">
        <button id="instagramBtn" type="button" class="social-btn" style="display:none"><i class="fab fa-instagram"></i><span>Instagram</span></button>
        <button id="facebookBtn" type="button" class="social-btn" style="display:none"><i class="fab fa-facebook-f"></i><span>Facebook</span></button>
        <button id="siteBtn" type="button" class="social-btn" style="display:none"><span class="material-icons-round">public</span><span>Site</span></button>
      </div>

      <div class="location-block" id="locationBlock" style="display:none">
        <div class="section-label"><span class="material-icons-round">location_on</span><span>Localização</span></div>
        <div class="map-container" id="mapContainer"><iframe id="mapIframe" title="Mapa" src="" width="100%" height="200" style="border:0" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
        <a href="#" id="mapLink" target="_blank" rel="noopener noreferrer" class="map-link"><span class="material-icons-round">open_in_new</span>Abrir no Maps</a>
      </div>

      <div class="info-block" id="horarioBlock" style="display:none">
        <div class="info-icon"><span class="material-icons-round">schedule</span></div>
        <div class="info-content"><h3>Horário</h3><p id="horarioTexto"></p></div>
      </div>

      <p class="powered-by">Feito com <span class="heart">♥</span> <a href="https://whatslink-48tc.onrender.com/" target="_blank" rel="noopener noreferrer">WhatsLink</a></p>
    </section>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwdPWLdfJuzb_gr3vWqn6HAGc1vb-trUWzvIZlIOC6RMmvWRxB6qbNI15gPkWnyzxoSfQ/exec';
    const THEME_COLORS = { verde:'#25D366', azul:'#3b82f6', roxo:'#8b5cf6', laranja:'#f97316', preto:'#d4af37', cardapio:'#ff8f00' };
    const THEME_RGB = { verde:'37,211,102', azul:'59,130,246', roxo:'139,92,246', laranja:'249,115,22', preto:'212,175,55', cardapio:'255,143,0' };
    const $ = id => document.getElementById(id);

    // Função para carregar CSS dinamicamente
    function carregarCssTema(tema) {
      document.querySelectorAll('link[data-theme-css]').forEach(el => el.remove());
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `css/redirect/${tema}.css`;
      link.dataset.themeCss = 'true';
      link.onerror = () => {
        console.error('Erro ao carregar CSS do tema:', tema);
        if (tema !== 'verde') carregarCssTema('verde');
      };
      document.head.appendChild(link);
    }

    // Funções auxiliares
    function fetchTimeout(url, ms=10000) {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), ms);
      return fetch(url, { signal: c.signal }).finally(() => clearTimeout(t));
    }

    function removeLoaders() {
      document.querySelectorAll('.loading-placeholder').forEach(e => e.classList.remove('loading-placeholder'));
    }

    function errBox(msg) {
      removeLoaders();
      $('container').innerHTML = `
        <div class="error-state">
          <div class="error-icon"><span class="material-icons-round">error_outline</span></div>
          <h2>Link não encontrado</h2>
          <p>${msg}</p>
          <a href="/">Voltar</a>
        </div>`;
    }

    function detectarTipoLink(url) {
      if (!url) return 'vazio';
      if (url.includes('/embed') || url.includes('output=embed')) return 'embed';
      if (url.includes('goo.gl')) return 'curto';
      if (url.includes('google.com/maps')) return 'normal';
      return 'outro';
    }

    function criarCardLocalizacao(url, cor) {
      return `
        <div class="location-fallback">
          <div class="location-fallback-icon"><span class="material-icons-round">location_on</span></div>
          <p>Ver no Google Maps</p>
          <a href="${url}" target="_blank" rel="noopener noreferrer" style="background:${cor}"><span class="material-icons-round">map</span>Abrir Maps</a>
        </div>`;
    }

    function formatarWhatsApp(numero) {
      let v = String(numero || '').replace(/\D/g, '');
      if (v.length >= 10 && v.length <= 11) v = '55' + v;
      return v;
    }

    // Inicialização
    (async () => {
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug')?.trim();
      if (!slug) { location.replace('/'); return; }

      try {
        const response = await fetchTimeout(`${API_URL}?slug=${encodeURIComponent(slug)}`);
        if (!response.ok) throw new Error('Falha na conexão');
        const data = await response.json();
        if (data.error) throw new Error(data.error);

        removeLoaders();

        const tema = ['verde','azul','roxo','laranja','preto','cardapio'].includes(data.tema) ? data.tema : 'verde';
        carregarCssTema(tema);

        document.documentElement.style.setProperty('--theme', THEME_COLORS[tema]);
        document.documentElement.style.setProperty('--theme-rgb', THEME_RGB[tema]);
        $('container').className = `reception-page theme-${tema}`;
        $('themeColorMeta').content = THEME_COLORS[tema];
        document.title = `${data.empresa || 'WhatsApp'} | WhatsApp`;

        const container = $('container');
        const temBanner = !!data.banner_url?.trim();
        const temLogo = !!data.logo_url?.trim();

        // Cabeçalho
        if (temBanner) {
          $('bannerImg').src = data.banner_url;
          $('bannerDiv').style.display = 'block';
          container.classList.remove('no-banner');
        } else if (temLogo) {
          $('logoBannerImg').src = data.logo_url;
          $('logoBannerDiv').style.display = 'block';
          container.classList.add('no-banner');
          // Oculta avatar inferior
          $('logoCircle').style.display = 'none';
          $('avatarCircle').style.display = 'none';
        } else {
          $('colorBannerDiv').style.display = 'flex';
          container.classList.add('no-banner');
        }

        // Logo inferior ou avatar
        if (temLogo && temBanner) {
          // Se tem banner e logo, mostramos avatar circular
          $('logoCircleImg').src = data.logo_url;
          $('logoCircle').style.display = 'flex';
          $('avatarCircle').style.display = 'none';
        } else if (!temLogo) {
          $('avatarLetter').textContent = (data.empresa || 'W').charAt(0).toUpperCase();
          $('avatarCircle').style.display = 'flex';
        }

        // Nome e descrição
        $('empresaNome').textContent = data.empresa || '';
        if (data.descricao?.trim()) {
          $('descricaoTexto').textContent = data.descricao;
          $('descricaoTexto').style.display = 'block';
        }
        if (tema === 'preto') $('divider').style.display = 'block';

        // WhatsApp principal
        const wa1 = formatarWhatsApp(data.whatsapp);
        let url1 = `https://wa.me/${wa1}`;
        if (data.mensagem?.trim()) url1 += `?text=${encodeURIComponent(data.mensagem)}`;
        $('whatsappBtnText').textContent = data.botao_whatsapp?.trim() || 'Falar no WhatsApp';
        $('whatsappBtn').onclick = () => window.open(url1, '_blank', 'noopener,noreferrer');

        // WhatsApp secundário
        if (String(data.whatsapp2 || '').replace(/\D/g,'').length >= 10) {
          const wa2 = formatarWhatsApp(data.whatsapp2);
          let url2 = `https://wa.me/${wa2}`;
          if (data.mensagem?.trim()) url2 += `?text=${encodeURIComponent(data.mensagem)}`;
          $('whatsappBtn2Text').textContent = data.botao_whatsapp2?.trim() || 'Falar no WhatsApp';
          $('whatsappBtn2').style.display = 'flex';
          $('whatsappBtn2').onclick = () => window.open(url2, '_blank', 'noopener,noreferrer');
        }

        // Redes sociais
        let temSocial = false;
        if (data.instagram?.trim()) {
          $('instagramBtn').style.display = 'flex';
          $('instagramBtn').onclick = () => window.open(`https://instagram.com/${data.instagram.replace('@','').trim()}`, '_blank');
          temSocial = true;
        }
        if (data.facebook?.trim()) {
          $('facebookBtn').style.display = 'flex';
          $('facebookBtn').onclick = () => window.open(data.facebook, '_blank');
          temSocial = true;
        }
        if (data.site?.trim()) {
          $('siteBtn').style.display = 'flex';
          $('siteBtn').onclick = () => window.open(data.site, '_blank');
          temSocial = true;
        }
        if (temSocial) $('socialLinks').style.display = 'flex';

        // Localização
        if (data.localizacao?.trim()) {
          const locUrl = data.localizacao.trim();
          $('locationBlock').style.display = 'block';
          $('mapLink').href = locUrl;
          const tipo = detectarTipoLink(locUrl);
          const iframe = $('mapIframe');
          const mapBox = $('mapContainer');

          if (tipo === 'embed') {
            iframe.src = locUrl;
          } else if (tipo === 'curto' || tipo === 'outro') {
            iframe.style.display = 'none';
            mapBox.innerHTML = criarCardLocalizacao(locUrl, THEME_COLORS[tema]);
          } else {
            let embedUrl = locUrl;
            if (!embedUrl.includes('output=embed')) embedUrl += (embedUrl.includes('?') ? '&' : '?') + 'output=embed';
            iframe.src = embedUrl;
          }
        }

        // Horário
        if (data.horario?.trim()) {
          $('horarioBlock').style.display = 'flex';
          $('horarioTexto').textContent = data.horario;
        }

      } catch (err) {
        errBox(err.message || 'Link não encontrado');
      }
    })();
  </script>
</body>
</html>

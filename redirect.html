  <style>
    :root { --theme:#25D366; --theme-rgb:37,211,102; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; background:#08080a; overflow-x:hidden; }
    body { font-family:'Outfit',sans-serif; color:#fff; min-height:100dvh; display:flex; justify-content:center; -webkit-font-smoothing:antialiased; }

    /* Fundo da página */
    .reception-body {
      background:
        radial-gradient(600px circle at 0% 0%, rgba(var(--theme-rgb),.14), transparent 40%),
        radial-gradient(800px circle at 100% 100%, rgba(var(--theme-rgb),.08), transparent),
        #08080a;
    }

    /* Container principal (conteúdo central) */
    .reception-page {
      width:100%; max-width:480px; min-height:100dvh; margin:0 auto;
      background:#111113; position:relative; display:flex; flex-direction:column;
      opacity:0; transform:translateY(10px);
      transition:opacity .3s ease, transform .4s cubic-bezier(.2,.8,.2,1);
      will-change:opacity, transform;
    }
    .reception-page.loaded { opacity:1; transform:translateY(0); }

    @media (min-width:600px) {
      .reception-page { margin:32px auto; min-height:auto; border-radius:32px; border:1px solid rgba(255,255,255,.06); }
    }

    /* Cabeçalho visual */
    .header-visual {
      width:100%; height:280px; position:relative;
      background:radial-gradient(circle at 50% 30%, rgba(var(--theme-rgb),.22), transparent 60%), #151517;
      overflow:hidden; flex-shrink:0;
    }
    .header-visual::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(to bottom, transparent 40%, #111113 92%);
      z-index:2; pointer-events:none;
    }
    .banner-image, .color-banner { position:absolute; inset:0; width:100%; height:100%; }
    .banner-image img { width:100%; height:100%; object-fit:cover; display:block; }
    .color-banner { display:grid; place-items:center; color:var(--theme); font-size:72px; opacity:.9; }

    /* Conteúdo com avatar sobreposto */
    .reception-content {
      padding:0 24px 32px; position:relative; z-index:5;
      display:flex; flex-direction:column; align-items:center; margin-top:-48px;
    }

    /* Logo ou avatar */
    .logo-circle, .avatar-circle {
      width:96px; height:96px; border-radius:50%; flex-shrink:0;
      border:4px solid #111113; box-shadow:0 12px 24px rgba(0,0,0,.4);
      overflow:hidden; display:flex; align-items:center; justify-content:center; background:#1a1a1e;
    }
    .logo-circle img { width:100%; height:100%; object-fit:cover; }
    .avatar-circle { background:linear-gradient(135deg, var(--theme), #128C7E); color:#fff; font-size:38px; font-weight:700; }

    /* Nome e descrição */
    .company-name { min-height:32px; font-size:26px; font-weight:700; letter-spacing:-.03em; margin:16px 0 8px; text-align:center; }
    .company-desc { min-height:20px; font-size:15px; color:#9f9fa9; text-align:center; max-width:32ch; margin:0 0 24px; }

    /* Botões WhatsApp */
    .whatsapp-btn {
      width:100%; height:56px; border:0; border-radius:999px;
      background:linear-gradient(135deg, var(--theme), #128C7E); color:#fff; font-weight:600;
      display:flex; align-items:center; justify-content:center; gap:12px; cursor:pointer;
      position:relative; overflow:hidden;
    }
    .whatsapp-btn.secondary {
      margin-top:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
    }
    .whatsapp-icon { width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.2); display:grid; place-items:center; font-size:16px; }
    .btn-shine {
      position:absolute; top:0; left:-100%; width:60%; height:100%;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
      transform:skewX(-20deg); animation:shine 4s infinite;
    }
    @keyframes shine { 0%,60% { left:-100%; } 80%,100% { left:150%; } }

    /* Redes sociais */
    .social-links { width:100%; display:flex; gap:10px; margin-top:16px; }
    .social-btn {
      flex:1; height:46px; border-radius:999px; border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.05); color:#a1a1aa; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    }

    /* Cards de localização e horário */
    .location-block, .info-block {
      width:100%; margin-top:20px; border-radius:24px; border:1px solid rgba(255,255,255,.06);
      background:rgba(255,255,255,.03); overflow:hidden;
    }

    /* Rodapé */
    .powered-by { margin-top:28px; font-size:11px; color:#52525b; }
    .powered-by a { color:#71717a; text-decoration:none; }

    /* Classe para esconder elementos */
    .hidden { display:none !important; }

    /* Preserva quebras de linha digitadas pelo usuário */
    .company-desc,
    .info-content p,
    #horarioTexto {
    white-space: pre-line; }

  </style>
</head>

  <!-- ================= SCRIPT PRINCIPAL (LÓGICA DA PÁGINA) ================= -->
  <script>
    'use strict';

    // Configurações gerais
    const CONFIG = {
      API_URL: 'https://script.google.com/macros/s/AKfycbwdPWLdfJuzb_gr3vWqn6HAGc1vb-trUWzvIZlIOC6RMmvWRxB6qbNI15gPkWnyzxoSfQ/exec',
      TIMEOUT_MS: 10000,
      MAX_RETRIES: 2,
      THEMES: ['verde', 'azul', 'roxo', 'laranja', 'preto', 'cardapio'],
      DEFAULT_THEME: 'verde',
      THEME_COLORS: { verde:'#25D366', azul:'#3b82f6', roxo:'#8b5cf6', laranja:'#f97316', preto:'#d4af37', cardapio:'#ff8f00' },
      THEME_RGB: { verde:'37,211,102', azul:'59,130,246', roxo:'139,92,246', laranja:'249,115,22', preto:'212,175,55', cardapio:'255,143,0' }
    };

    const $ = id => document.getElementById(id);
    const $$ = selector => [...document.querySelectorAll(selector)];

    // Funções auxiliares
    function sanitizeString(value, maxLength = 500) {
      if (value === null || value === undefined) return '';
      return String(value).trim().slice(0, maxLength);
    }

    function sanitizeUrl(url) {
      if (!url) return '';
      const trimmed = String(url).trim();
      if (!trimmed) return '';
      try {
        const parsed = new URL(trimmed);
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return trimmed;
      } catch (e) {}
      return '';
    }

    function formatarWhatsApp(numero) {
      let v = String(numero || '').replace(/\D/g, '');
      if (v.length >= 10 && v.length <= 11) v = '55' + v;
      return v;
    }

    function isValidWhatsApp(numero) {
      const v = formatarWhatsApp(numero);
      return v.length >= 12 && v.length <= 13;
    }

    function detectarTipoLink(url) {
      if (!url) return 'vazio';
      if (url.includes('/embed') || url.includes('output=embed')) return 'embed';
      if (url.includes('goo.gl') || url.includes('maps.app.goo.gl')) return 'curto';
      if (url.includes('google.com/maps') || url.includes('google.com.br/maps')) return 'normal';
      return 'outro';
    }

    function criarCardLocalizacao(url, cor) {
      return `
        <div class="location-fallback">
          <div class="location-fallback-icon"><span class="material-icons-round">location_on</span></div>
          <p>Ver no Google Maps</p>
          <a href="${url}" target="_blank" rel="noopener noreferrer" style="background:${cor}"><span class="material-icons-round">map</span>Abrir Maps</a>
        </div>`;
    }

    function isValidTheme(tema) {
      return CONFIG.THEMES.includes(tema);
    }

    // Carregar CSS do tema dinamicamente
    function carregarCssTema(tema) {
      return new Promise((resolve, reject) => {
        const safe = isValidTheme(tema) ? tema : CONFIG.DEFAULT_THEME;
        const href = `css/redirect/${safe}.css`;

        if (document.querySelector(`link[href="${href}"]`)) {
          resolve(safe);
          return;
        }

        $$('link[data-theme-css]').forEach(el => el.remove());

        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.dataset.themeCss = 'true';

        link.onload = () => resolve(safe);
        link.onerror = () => {
          if (safe !== CONFIG.DEFAULT_THEME) {
            carregarCssTema(CONFIG.DEFAULT_THEME).then(resolve).catch(reject);
          } else {
            reject(new Error('Não foi possível carregar o CSS do tema'));
          }
        };

        document.head.appendChild(link);
      });
    }

    // Fetch com retry
    async function fetchRetry(url, retries = CONFIG.MAX_RETRIES) {
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), CONFIG.TIMEOUT_MS);
          const response = await fetch(url, { signal: controller.signal });
          clearTimeout(timeout);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response;
        } catch (error) {
          if (attempt === retries) throw error;
          await new Promise(resolve => setTimeout(resolve, 400 * (attempt + 1)));
        }
      }
    }

    // Remover placeholders
    function removeLoaders() {
      $$('.loading-placeholder').forEach(el => el.classList.remove('loading-placeholder'));
    }

    // Mostrar erro amigável
    function showError(message) {
      removeLoaders();
      const container = $('container');
      container.innerHTML = `
        <div style="min-height:100dvh; display:grid; place-items:center; padding:24px; text-align:center">
          <div>
            <div style="font-size:48px; margin-bottom:16px;">😕</div>
            <h2 style="margin:0 0 8px; font-size:20px;">Algo deu errado</h2>
            <p style="color:#a1a1aa; font-size:14px; max-width:28ch; margin:0 auto 20px;">${message || 'Não foi possível carregar os dados.'}</p>
            <button onclick="location.reload()" style="padding:12px 20px; border-radius:999px; background:#fff; color:#000; border:none; cursor:pointer; font-weight:600; font-size:13px;">
              Atualizar página
            </button>
          </div>
        </div>`;
      container.classList.add('loaded');
      container.style.opacity = '';
    }

    // Renderizar cabeçalho
    function renderizarHeader(data, container) {
      const temBanner = sanitizeUrl(data.banner_url) !== '';
      const temLogo = sanitizeUrl(data.logo_url) !== '';

      $('bannerDiv').classList.add('hidden');
      $('colorBannerDiv').classList.add('hidden');
      $('logoCircle').classList.add('hidden');
      $('avatarCircle').classList.add('hidden');
      container.classList.remove('no-banner', 'has-banner');

      if (temBanner) {
        $('bannerDiv').classList.remove('hidden');
        $('bannerImg').src = sanitizeUrl(data.banner_url);
        container.classList.add('has-banner');
      } else {
        container.classList.add('no-banner');
        $('colorBannerDiv').classList.remove('hidden');
      }

      if (temLogo) {
        $('logoCircleImg').src = sanitizeUrl(data.logo_url);
        $('logoCircle').classList.remove('hidden');
      } else {
        $('avatarLetter').textContent = (data.empresa || 'W').charAt(0).toUpperCase();
        $('avatarCircle').classList.remove('hidden');
      }
    }

    // Renderizar botões WhatsApp
    function renderizarWhatsApp(data) {
      if (isValidWhatsApp(data.whatsapp)) {
        const wa = formatarWhatsApp(data.whatsapp);
        let url = `https://wa.me/${wa}`;
        if (data.mensagem) url += `?text=${encodeURIComponent(data.mensagem)}`;
        $('whatsappBtnText').textContent = sanitizeString(data.botao_whatsapp, 50) || 'Falar no WhatsApp';
        $('whatsappBtn').onclick = () => window.open(url, '_blank', 'noopener,noreferrer');
      } else {
        $('whatsappBtnText').textContent = 'WhatsApp indisponível';
      }

      if (isValidWhatsApp(data.whatsapp2)) {
        const wa2 = formatarWhatsApp(data.whatsapp2);
        let url2 = `https://wa.me/${wa2}`;
        if (data.mensagem) url2 += `?text=${encodeURIComponent(data.mensagem)}`;
        $('whatsappBtn2Text').textContent = sanitizeString(data.botao_whatsapp2, 50) || 'Falar no WhatsApp';
        $('whatsappBtn2').classList.remove('hidden');
        $('whatsappBtn2').onclick = () => window.open(url2, '_blank', 'noopener,noreferrer');
      }
    }

    // Renderizar redes sociais
    function renderizarRedesSociais(data) {
      let temSocial = false;
      if (data.instagram) {
        $('instagramBtn').classList.remove('hidden');
        $('instagramBtn').onclick = () => window.open(`https://instagram.com/${data.instagram.replace('@','').trim()}`, '_blank');
        temSocial = true;
      }
      if (sanitizeUrl(data.facebook)) {
        $('facebookBtn').classList.remove('hidden');
        $('facebookBtn').onclick = () => window.open(sanitizeUrl(data.facebook), '_blank');
        temSocial = true;
      }
      if (sanitizeUrl(data.site)) {
        $('siteBtn').classList.remove('hidden');
        $('siteBtn').onclick = () => window.open(sanitizeUrl(data.site), '_blank');
        temSocial = true;
      }
      if (temSocial) $('socialLinks').classList.remove('hidden');
    }

    // Renderizar localização
    function renderizarLocalizacao(data, tema) {
      if (!data.localizacao) return;
      const locUrl = sanitizeUrl(data.localizacao) || data.localizacao.trim();
      const tipo = detectarTipoLink(locUrl);
      $('locationBlock').classList.remove('hidden');
      $('mapLink').href = locUrl;
      if (tipo === 'embed') {
        $('mapIframe').src = locUrl;
        $('mapIframe').style.display = 'block';
      } else if (tipo === 'curto' || tipo === 'outro') {
        $('mapIframe').style.display = 'none';
        $('mapContainer').innerHTML = criarCardLocalizacao(locUrl, CONFIG.THEME_COLORS[tema]);
      } else {
        let embedUrl = locUrl;
        if (!embedUrl.includes('output=embed')) embedUrl += (embedUrl.includes('?') ? '&' : '?') + 'output=embed';
        $('mapIframe').src = embedUrl;
        $('mapIframe').style.display = 'block';
      }
    }

    // Renderizar horário
    function renderizarHorario(data) {
      if (!data.horario) return;
      $('horarioBlock').classList.remove('hidden');
      $('horarioTexto').textContent = sanitizeString(data.horario, 300);
    }

    // Atualizar meta tags OG dinamicamente
    function atualizarMetaTags(data, slug) {
      const ogTitle = `${data.empresa || 'WhatsApp'} | WhatsApp`;
      const ogDescription = data.descricao || 'Entre em contato pelo WhatsApp.';
      const ogImage = data.logo_url || data.banner_url || 'https://whatslink-48tc.onrender.com/og-image.png';
      const ogUrl = `https://whatslink-48tc.onrender.com/redirect.html?slug=${encodeURIComponent(slug)}`;

      $('ogTitle').setAttribute('content', ogTitle);
      $('ogDescription').setAttribute('content', ogDescription);
      $('ogImage').setAttribute('content', ogImage);
      $('ogUrl').setAttribute('content', ogUrl);

      $('twitterTitle').setAttribute('content', ogTitle);
      $('twitterDescription').setAttribute('content', ogDescription);
      $('twitterImage').setAttribute('content', ogImage);
    }

    // Inicialização principal
    async function init() {
      const container = $('container');
      container.style.opacity = '0';

      const slug = new URLSearchParams(location.search).get('slug')?.trim();
      if (!slug) { location.replace('/'); return; }

      try {
        const response = await fetchRetry(`${CONFIG.API_URL}?slug=${encodeURIComponent(slug)}`);
        const text = await response.text();
        const data = JSON.parse(text);
        if (data.error) throw new Error(data.error);

        const tema = isValidTheme(data.tema) ? data.tema : CONFIG.DEFAULT_THEME;
        await carregarCssTema(tema);

        document.documentElement.style.setProperty('--theme', CONFIG.THEME_COLORS[tema]);
        document.documentElement.style.setProperty('--theme-rgb', CONFIG.THEME_RGB[tema]);
        $('themeColorMeta').content = CONFIG.THEME_COLORS[tema];
        container.className = `reception-page theme-${tema}`;
        document.title = `${sanitizeString(data.empresa, 60) || 'WhatsApp'} | WhatsApp`;

        atualizarMetaTags(data, slug);

        if (typeof gtag === 'function') {
          gtag('event', 'view_link', {
            'link_id': data.id,
            'slug': slug,
            'theme': tema
          });
        }

        renderizarHeader(data, container);
        $('empresaNome').textContent = sanitizeString(data.empresa, 100) || 'WhatsApp';
        if (data.descricao) {
          $('descricaoTexto').textContent = sanitizeString(data.descricao, 500);
          $('descricaoTexto').classList.remove('hidden');
        }
        if (tema === 'preto') $('divider').classList.remove('hidden');
        renderizarWhatsApp(data);
        renderizarRedesSociais(data);
        renderizarLocalizacao(data, tema);
        renderizarHorario(data);
        removeLoaders();

        requestAnimationFrame(() => {
          container.classList.add('loaded');
          container.style.opacity = '';
        });

      } catch (error) {
        console.error('[WhatsLink] Erro:', error);
        showError(error.message || 'Não foi possível carregar este link');
      }
    }

    init();
  </script>

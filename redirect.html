<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#25D366" />
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2325D366'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2325D366'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=Manrope:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/redirect/verde.css" />
  <link rel="stylesheet" href="css/redirect/azul.css" />
  <link rel="stylesheet" href="css/redirect/roxo.css" />
  <link rel="stylesheet" href="css/redirect/laranja.css" />
  <link rel="stylesheet" href="css/redirect/preto.css" />
  <link rel="stylesheet" href="css/redirect/cardapio.css" />
  
  <style>
    /* Efeito shimmer nos elementos enquanto carrega */
    .shimmer {
      position: relative;
      overflow: hidden;
      background: #e2e8f0 !important;
      color: transparent !important;
      border-radius: 8px;
      animation: shimmerEffect 1.5s infinite;
    }
    
    .shimmer::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
      animation: shimmerSlide 1.5s infinite;
    }
    
    @keyframes shimmerEffect {
      0% { opacity: .7; }
      50% { opacity: 1; }
      100% { opacity: .7; }
    }
    
    @keyframes shimmerSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    /* Elementos com shimmer inicial */
    .company-name.shimmer { min-height: 28px; width: 60%; margin: 0 auto 6px; }
    .company-desc.shimmer { min-height: 16px; width: 80%; margin: 0 auto 22px; }
    .whatsapp-btn.shimmer { min-height: 56px; border-radius: 999px; }
    .logo-circle.shimmer, .avatar-circle.shimmer { border: none; }
  </style>
</head>
<body class="reception-body">
  <div class="reception-page theme-verde" id="container">
    <!-- CABEÇALHO VISUAL -->
    <div class="header-visual" id="headerVisual">
      <div class="banner-image" id="bannerDiv" style="display:none;"><img id="bannerImg" src="" alt="Banner" /></div>
      <div class="logo-banner" id="logoBannerDiv" style="display:none;"><img id="logoBannerImg" src="" alt="Logo" /><div class="glass-overlay"></div></div>
      <div class="color-banner" id="colorBannerDiv" style="display:none;"><span class="material-icons-round">storefront</span></div>
    </div>

    <!-- CONTEÚDO -->
    <div class="reception-content">
      <div class="logo-circle shimmer" id="logoCircle" style="display:none;"><img id="logoCircleImg" src="" alt="Logo" /></div>
      <div class="avatar-circle shimmer" id="avatarCircle"><span id="avatarLetter">A</span></div>

      <h1 class="company-name shimmer" id="empresaNome">&nbsp;</h1>
      <p class="company-desc shimmer" id="descricaoTexto" style="display:none;"></p>

      <div class="divider" id="divider" style="display:none;"></div>

      <button id="whatsappBtn" class="whatsapp-btn shimmer">
        <i class="fab fa-whatsapp"></i>
        <span id="whatsappBtnText">&nbsp;</span>
        <span class="btn-pulse"></span>
      </button>

      <button id="whatsappBtn2" class="whatsapp-btn" style="display:none; margin-top:10px;">
        <i class="fab fa-whatsapp"></i>
        <span id="whatsappBtn2Text">&nbsp;</span>
      </button>

      <div class="social-links" id="socialLinks" style="display:none;">
        <button id="instagramBtn" class="social-btn instagram" style="display:none;"><i class="fab fa-instagram"></i><span>Instagram</span></button>
        <button id="facebookBtn" class="social-btn facebook" style="display:none;"><i class="fab fa-facebook-f"></i><span>Facebook</span></button>
        <button id="siteBtn" class="social-btn site" style="display:none;"><span class="material-icons-round">public</span><span>Site</span></button>
      </div>

      <div class="location-block" id="locationBlock" style="display:none;">
        <div class="map-container" id="mapContainer">
          <iframe id="mapIframe" src="" width="100%" height="220" style="border:0; border-radius:18px; display:block;" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>
        <a href="#" id="mapLink" target="_blank" class="map-link">
          <span class="material-icons-round">open_in_new</span>
          <span>Abrir no Google Maps</span>
        </a>
      </div>

      <div class="info-block" id="horarioBlock" style="display:none;">
        <span class="material-icons-round">schedule</span>
        <div>
          <h3>Horário de atendimento</h3>
          <p id="horarioTexto"></p>
        </div>
      </div>

      <p class="powered-by">
        Criado com ❤️ <a href="https://whatslink-48tc.onrender.com/" style="color:inherit; text-decoration:underline; font-weight:700;">WhatsLink</a> • 100% grátis
      </p>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwdPWLdfJuzb_gr3vWqn6HAGc1vb-trUWzvIZlIOC6RMmvWRxB6qbNI15gPkWnyzxoSfQ/exec';
    
    function fetchComTimeout(url, options = {}, timeout = 8000) {
      return Promise.race([
        fetch(url, options),
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Tempo esgotado. Tente novamente.')), timeout)
        )
      ]);
    }

    function removerShimmer() {
      document.querySelectorAll('.shimmer').forEach(el => {
        el.classList.remove('shimmer');
      });
    }

    function mostrarErro(mensagem) {
      removerShimmer();
      document.getElementById('container').innerHTML = `
        <div class="error-state">
          <span class="material-icons-round">error</span>
          <p>${mensagem}</p>
          <a href="/">Ir para página inicial</a>
        </div>
      `;
    }

    async function buscarLink(slug) {
      const response = await fetchComTimeout(`${API_URL}?slug=${encodeURIComponent(slug)}`);
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      return data;
    }

    function detectarTipoLink(url) {
      if (!url) return 'vazio';
      if (url.includes('google.com/maps/embed') || url.includes('output=embed')) return 'embed';
      if (url.includes('maps.app.goo.gl') || url.includes('goo.gl/maps')) return 'curto';
      if (url.includes('google.com/maps') || url.includes('google.com.br/maps')) return 'normal';
      return 'outro';
    }

    function criarCardLocalizacao(url, tema) {
      return `
        <div style="padding:30px 20px; text-align:center; background:linear-gradient(135deg, #f8fafc, #f1f5f9); min-height:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; border-radius:18px;">
          <span class="material-icons-round" style="font-size:48px; color:${tema};">location_on</span>
          <p style="font-size:14px; color:#64748b; font-weight:500;">Toque abaixo para ver a localização</p>
          <a href="${url}" target="_blank" style="background:${tema}; color:white; padding:12px 20px; border-radius:999px; text-decoration:none; font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:6px;">
            <span class="material-icons-round" style="font-size:18px;">map</span>
            Abrir no Google Maps
          </a>
        </div>
      `;
    }

    (async function() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      
      if (!slug) {
        window.location.href = '/';
        return;
      }

      try {
        const link = await buscarLink(slug);
        removerShimmer();
        
        const tema = link.tema || 'verde';
        const container = document.getElementById('container');
        container.className = 'reception-page theme-' + tema;
        
        const coresTema = {
          verde: '#25D366', azul: '#3b82f6', roxo: '#8b5cf6',
          laranja: '#f97316', preto: '#d4af37', cardapio: '#ff8f00'
        };
        const corTema = coresTema[tema] || '#25D366';
        document.querySelector('meta[name="theme-color"]').content = corTema;
        
        document.title = link.empresa + ' | WhatsApp';

        const temBanner = link.banner_url && link.banner_url.trim() !== '';
        const temLogo = link.logo_url && link.logo_url.trim() !== '';
        
        if (temBanner) { 
          document.getElementById('bannerImg').src = link.banner_url; 
          document.getElementById('bannerDiv').style.display = 'block'; 
        } else if (temLogo) { 
          document.getElementById('logoBannerImg').src = link.logo_url; 
          document.getElementById('logoBannerDiv').style.display = 'block'; 
        } else { 
          document.getElementById('colorBannerDiv').style.display = 'flex'; 
        }

        if (temLogo) {
          document.getElementById('logoCircleImg').src = link.logo_url;
          document.getElementById('logoCircle').style.display = 'flex';
          document.getElementById('avatarCircle').style.display = 'none';
        } else {
          document.getElementById('avatarLetter').textContent = link.empresa.charAt(0).toUpperCase();
          document.getElementById('avatarCircle').style.display = 'flex';
        }

        document.getElementById('empresaNome').textContent = link.empresa;

        if (link.descricao && link.descricao.trim() !== '') { 
          document.getElementById('descricaoTexto').textContent = link.descricao; 
          document.getElementById('descricaoTexto').style.display = 'block'; 
        }

        if (tema === 'preto') {
          document.getElementById('divider').style.display = 'block';
        }

        let waNumber = String(link.whatsapp).replace(/\D/g, '');
        if (waNumber.length === 10 || waNumber.length === 11) waNumber = '55' + waNumber;
        let waUrl = 'https://wa.me/' + waNumber;
        if (link.mensagem && link.mensagem.trim() !== '') {
          waUrl += '?text=' + encodeURIComponent(link.mensagem);
        }

        if (link.botao_whatsapp && link.botao_whatsapp.trim() !== '') {
          document.getElementById('whatsappBtnText').textContent = link.botao_whatsapp;
        }

        document.getElementById('whatsappBtn').addEventListener('click', function() {
          window.open(waUrl, '_blank');
        });

        if (link.whatsapp2 && String(link.whatsapp2).replace(/\D/g, '') !== '') {
          let waNumber2 = String(link.whatsapp2).replace(/\D/g, '');
          if (waNumber2.length === 10 || waNumber2.length === 11) waNumber2 = '55' + waNumber2;
          let waUrl2 = 'https://wa.me/' + waNumber2;
          if (link.mensagem && link.mensagem.trim() !== '') {
            waUrl2 += '?text=' + encodeURIComponent(link.mensagem);
          }
          
          if (link.botao_whatsapp2 && link.botao_whatsapp2.trim() !== '') {
            document.getElementById('whatsappBtn2Text').textContent = link.botao_whatsapp2;
          }
          
          document.getElementById('whatsappBtn2').style.display = 'flex';
          document.getElementById('whatsappBtn2').addEventListener('click', function() {
            window.open(waUrl2, '_blank');
          });
        }

        let temSocial = false;
        if (link.instagram && link.instagram.trim() !== '') {
          document.getElementById('instagramBtn').style.display = 'flex';
          document.getElementById('instagramBtn').onclick = function() { window.open('https://instagram.com/' + link.instagram.replace('@',''), '_blank'); };
          temSocial = true;
        }
        if (link.facebook && link.facebook.trim() !== '') {
          document.getElementById('facebookBtn').style.display = 'flex';
          document.getElementById('facebookBtn').onclick = function() { window.open(link.facebook, '_blank'); };
          temSocial = true;
        }
        if (link.site && link.site.trim() !== '') {
          document.getElementById('siteBtn').style.display = 'flex';
          document.getElementById('siteBtn').onclick = function() { window.open(link.site, '_blank'); };
          temSocial = true;
        }
        if (temSocial) document.getElementById('socialLinks').style.display = 'flex';

        if (link.localizacao && link.localizacao.trim() !== '') {
          const locUrl = link.localizacao.trim();
          const tipoLink = detectarTipoLink(locUrl);
          
          document.getElementById('locationBlock').style.display = 'block';
          document.getElementById('mapLink').href = locUrl;
          document.getElementById('mapLink').style.display = 'flex';
          
          const mapContainer = document.getElementById('mapContainer');
          const mapIframe = document.getElementById('mapIframe');
          
          if (tipoLink === 'embed') {
            mapIframe.src = locUrl;
            mapIframe.style.display = 'block';
          } else if (tipoLink === 'curto' || tipoLink === 'outro') {
            mapIframe.style.display = 'none';
            mapContainer.innerHTML = criarCardLocalizacao(locUrl, corTema);
          } else if (tipoLink === 'normal') {
            let embedUrl = locUrl;
            if (!embedUrl.includes('output=embed')) {
              embedUrl = embedUrl + (embedUrl.includes('?') ? '&' : '?') + 'output=embed';
            }
            mapIframe.src = embedUrl;
            mapIframe.style.display = 'block';
          }
        }

        if (link.horario && link.horario.trim() !== '') { 
          document.getElementById('horarioBlock').style.display = 'flex'; 
          document.getElementById('horarioTexto').textContent = link.horario; 
        }

      } catch (err) {
        mostrarErro(err.message || 'Link não encontrado');
      }
    })();
  </script>
</body>
</html>

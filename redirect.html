<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Carregando...</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="reception-page" id="container">
    <!-- BANNER / HEADER -->
    <div class="header-container" id="headerContainer">
      <!-- Se tiver banner, mostra banner -->
      <div class="banner-image" id="bannerImageDiv" style="display: none;">
        <img id="bannerImage" src="" alt="Banner" />
      </div>
      
      <!-- Se NÃO tiver banner mas tiver logo, mostra logo com efeito vidro -->
      <div class="logo-banner" id="logoBannerDiv" style="display: none;">
        <img id="logoBannerImage" src="" alt="Logo" />
        <div class="glass-overlay"></div>
      </div>
      
      <!-- Se não tiver nenhum, mostra cor sólida -->
      <div class="color-banner" id="colorBannerDiv">
        <div class="color-banner-content">
          <span class="material-icons">storefront</span>
        </div>
      </div>
    </div>
    
    <!-- CABEÇALHO COM LOGO -->
    <div class="reception-header">
      <div class="company-logo" id="companyLogo" style="display: none;">
        <img id="logoImage" src="" alt="Logo" />
      </div>
      <div class="company-avatar" id="companyAvatar">
        <span id="avatarLetter">A</span>
      </div>
    </div>
    
    <!-- INFORMAÇÕES DA EMPRESA -->
    <div class="company-info">
      <h1 id="empresaNome">Carregando...</h1>
      <p class="company-description" id="empresaDescricao" style="display: none;"></p>
    </div>
    
    <!-- LOCALIZAÇÃO (só se preenchido) -->
    <div class="map-container" id="mapContainer" style="display: none;">
      <div class="map-header">
        <span class="material-icons map-icon">location_on</span>
        <h3>Nossa localização</h3>
      </div>
      <div class="map-embed" id="mapEmbed">
        <p>Carregando mapa...</p>
      </div>
      <a href="#" id="mapLink" target="_blank" class="map-link">
        <span class="material-icons">open_in_new</span>
        Abrir no Google Maps
      </a>
    </div>
    
    <!-- BOTÃO WHATSAPP -->
    <div class="whatsapp-button-container">
      <button id="whatsappBtn" class="btn-whatsapp">
        <i class="fab fa-whatsapp btn-icon"></i>
        <span>Chamar no WhatsApp</span>
      </button>
    </div>
    
    <!-- REDES SOCIAIS (só se preenchido) -->
    <div class="social-buttons" id="socialButtons" style="display: none;">
      <button id="instagramBtn" class="btn-social btn-instagram" style="display: none;">
        <i class="fab fa-instagram btn-icon"></i>
        <span>Instagram</span>
      </button>
      
      <button id="facebookBtn" class="btn-social btn-facebook" style="display: none;">
        <i class="fab fa-facebook-f btn-icon"></i>
        <span>Facebook</span>
      </button>
      
      <button id="siteBtn" class="btn-social btn-site" style="display: none;">
        <span class="material-icons btn-icon">public</span>
        <span>Site</span>
      </button>
    </div>
    
    <!-- HORÁRIO (só se preenchido) -->
    <div class="additional-info">
      <div id="horarioInfo" class="info-item" style="display: none;">
        <span class="material-icons info-icon">schedule</span>
        <div>
          <h3>Horário</h3>
          <p id="horarioTexto"></p>
        </div>
      </div>
    </div>
    
    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay" style="display: none;">
      <div class="modal-content">
        <div class="spinner"></div>
        <h3>Abrindo WhatsApp...</h3>
        <p>Você será redirecionado em instantes</p>
        <button id="cancelRedirect" class="btn-cancel">
          <span class="material-icons">close</span>
          Cancelar
        </button>
        <a href="#" id="waLink" target="_blank" class="wa-link">
          <span class="material-icons">open_in_new</span>
          Ou clique aqui se não redirecionar
        </a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwdPWLdfJuzb_gr3vWqn6HAGc1vb-trUWzvIZlIOC6RMmvWRxB6qbNI15gPkWnyzxoSfQ/exec';

    async function buscarLink(slug) {
      try {
        const response = await fetch(`${API_URL}?slug=${encodeURIComponent(slug)}`);
        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error);
        }
        
        return data;
      } catch (err) {
        throw new Error('Link não encontrado');
      }
    }

    (async function() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) {
        document.getElementById('container').innerHTML = 
          '<p style="text-align:center;padding:40px;">Link inválido</p>';
        return;
      }

      try {
        const link = await buscarLink(slug);
        
        console.log('Dados recebidos:', link); // Debug
        
        document.title = `${link.empresa} - Página Oficial`;
        
        // ========== BANNER / LOGO NO HEADER ==========
        const temBanner = link.banner_url && String(link.banner_url).trim() !== '';
        const temLogo = link.logo_url && String(link.logo_url).trim() !== '';
        
        if (temBanner) {
          // Tem banner - mostra banner normalmente
          document.getElementById('bannerImage').src = link.banner_url;
          document.getElementById('bannerImageDiv').style.display = 'block';
          document.getElementById('logoBannerDiv').style.display = 'none';
          document.getElementById('colorBannerDiv').style.display = 'none';
        } else if (temLogo) {
          // Não tem banner mas tem logo - mostra logo com efeito vidro
          document.getElementById('logoBannerImage').src = link.logo_url;
          document.getElementById('logoBannerDiv').style.display = 'block';
          document.getElementById('bannerImageDiv').style.display = 'none';
          document.getElementById('colorBannerDiv').style.display = 'none';
        } else {
          // Não tem nenhum - mostra cor sólida
          document.getElementById('colorBannerDiv').style.display = 'block';
          document.getElementById('bannerImageDiv').style.display = 'none';
          document.getElementById('logoBannerDiv').style.display = 'none';
        }
        
        // ========== LOGO CIRCULAR ==========
        if (temLogo) {
          document.getElementById('logoImage').src = link.logo_url;
          document.getElementById('companyLogo').style.display = 'block';
          document.getElementById('companyAvatar').style.display = 'none';
        } else {
          document.getElementById('avatarLetter').textContent = link.empresa.charAt(0).toUpperCase();
        }
        
        // ========== NOME DA EMPRESA ==========
        document.getElementById('empresaNome').textContent = link.empresa;
        
        // ========== DESCRIÇÃO (só se preenchida) ==========
        if (link.descricao && String(link.descricao).trim() !== '') {
          document.getElementById('empresaDescricao').textContent = link.descricao;
          document.getElementById('empresaDescricao').style.display = 'block';
        }
        
        // ========== LOCALIZAÇÃO (só se preenchida) ==========
        if (link.localizacao && String(link.localizacao).trim() !== '') {
          document.getElementById('mapContainer').style.display = 'block';
          document.getElementById('mapLink').href = link.localizacao;
          
          if (link.localizacao.includes('maps.google.com') || link.localizacao.includes('goo.gl/maps')) {
            const iframe = document.createElement('iframe');
            iframe.src = link.localizacao.replace('/maps?', '/maps?output=embed&');
            iframe.width = '100%';
            iframe.height = '200';
            iframe.style.border = '0';
            iframe.allowFullscreen = true;
            iframe.loading = 'lazy';
            
            document.getElementById('mapEmbed').innerHTML = '';
            document.getElementById('mapEmbed').appendChild(iframe);
          } else {
            document.getElementById('mapEmbed').innerHTML = 
              '<p>Clique para ver a localização</p>';
          }
        }
        
        // ========== WHATSAPP ==========
        let waNumber = String(link.whatsapp).replace(/\D/g, '');
        if (waNumber.length === 10 || waNumber.length === 11) {
          waNumber = '55' + waNumber;
        }
        let waUrl = `https://wa.me/${waNumber}`;
        if (link.mensagem && String(link.mensagem).trim() !== '') {
          waUrl += `?text=${encodeURIComponent(link.mensagem)}`;
        }
        
        document.getElementById('waLink').href = waUrl;
        
        document.getElementById('whatsappBtn').addEventListener('click', () => {
          document.getElementById('modalOverlay').style.display = 'flex';
          
          setTimeout(() => {
            window.open(waUrl, '_blank');
            document.getElementById('modalOverlay').style.display = 'none';
          }, 2000);
        });
        
        document.getElementById('cancelRedirect').addEventListener('click', () => {
          document.getElementById('modalOverlay').style.display = 'none';
        });
        
        // ========== REDES SOCIAIS (só se preenchidas) ==========
        let temRedeSocial = false;
        
        if (link.instagram && String(link.instagram).trim() !== '') {
          document.getElementById('instagramBtn').style.display = 'flex';
          document.getElementById('instagramBtn').addEventListener('click', () => {
            const instagram = link.instagram.replace('@', '');
            window.open(`https://instagram.com/${instagram}`, '_blank');
          });
          temRedeSocial = true;
        }
        
        if (link.facebook && String(link.facebook).trim() !== '') {
          document.getElementById('facebookBtn').style.display = 'flex';
          document.getElementById('facebookBtn').addEventListener('click', () => {
            window.open(link.facebook, '_blank');
          });
          temRedeSocial = true;
        }
        
        if (link.site && String(link.site).trim() !== '') {
          document.getElementById('siteBtn').style.display = 'flex';
          document.getElementById('siteBtn').addEventListener('click', () => {
            window.open(link.site, '_blank');
          });
          temRedeSocial = true;
        }
        
        if (temRedeSocial) {
          document.getElementById('socialButtons').style.display = 'flex';
        }
        
        // ========== HORÁRIO (só se preenchido) ==========
        if (link.horario && String(link.horario).trim() !== '') {
          document.getElementById('horarioInfo').style.display = 'flex';
          document.getElementById('horarioTexto').textContent = link.horario;
        }
        
      } catch (err) {
        document.getElementById('container').innerHTML = 
          `<div style="text-align:center;padding:40px;">
            <span class="material-icons" style="font-size:48px;margin-bottom:20px;">link_off</span>
            <p style="color:#ef4444;">${err.message}</p>
            <a href="index.html" style="display:inline-block;margin-top:20px;color:#18181b;text-decoration:underline;">
              Voltar para página inicial
            </a>
          </div>`;
      }
    })();
  </script>
</body>
</html>

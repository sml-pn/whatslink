<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página de recepção</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="reception-page" id="container">
    <!-- Cabeçalho visual -->
    <div class="header-visual" id="headerVisual">
      <div class="banner-image" id="bannerDiv" style="display:none;">
        <img id="bannerImg" src="" alt="Banner" />
      </div>
      <div class="logo-banner" id="logoBannerDiv" style="display:none;">
        <img id="logoBannerImg" src="" alt="Logo" />
        <div class="glass-overlay"></div>
      </div>
      <div class="color-banner" id="colorBannerDiv">
        <span class="material-icons">storefront</span>
      </div>
    </div>

    <!-- Conteúdo principal -->
    <div class="reception-content">
      <div class="logo-circle" id="logoCircle" style="display:none;">
        <img id="logoCircleImg" src="" alt="Logo" />
      </div>
      <div class="avatar-circle" id="avatarCircle">
        <span id="avatarLetter">A</span>
      </div>

      <h1 class="company-name" id="empresaNome">Carregando...</h1>
      <p class="company-desc" id="descricaoTexto" style="display:none;"></p>

      <!-- Botão WhatsApp -->
      <button id="whatsappBtn" class="whatsapp-btn">
        <i class="fab fa-whatsapp"></i>
        <span>Chamar no WhatsApp</span>
      </button>

      <!-- Redes sociais -->
      <div class="social-links" id="socialLinks" style="display:none;">
        <button id="instagramBtn" class="social-btn instagram" style="display:none;">
          <i class="fab fa-instagram"></i> Instagram
        </button>
        <button id="facebookBtn" class="social-btn facebook" style="display:none;">
          <i class="fab fa-facebook-f"></i> Facebook
        </button>
        <button id="siteBtn" class="social-btn site" style="display:none;">
          <span class="material-icons">public</span> Site
        </button>
      </div>

      <!-- Localização -->
      <div class="location-block" id="locationBlock" style="display:none;">
        <div class="map-container">
          <iframe id="mapIframe" src="" width="100%" height="200" style="border:0;" loading="lazy"></iframe>
        </div>
        <a href="#" id="mapLink" target="_blank" class="map-link">
          <span class="material-icons">open_in_new</span> Abrir no Google Maps
        </a>
      </div>

      <!-- Horário -->
      <div class="info-block" id="horarioBlock" style="display:none;">
        <span class="material-icons">schedule</span>
        <div>
          <h3>Horário de funcionamento</h3>
          <p id="horarioTexto"></p>
        </div>
      </div>

      <!-- Rodapé discreto -->
      <p class="powered-by">Criado com <span class="heart">❤</span> WhatsLink</p>
    </div>

    <!-- Modal de redirecionamento -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
      <div class="modal-card">
        <div class="spinner"></div>
        <h3>Abrindo WhatsApp...</h3>
        <p>Você será redirecionado</p>
        <button id="cancelRedirect" class="btn-cancel">Cancelar</button>
        <a href="#" id="waLink" target="_blank" class="wa-link">Abrir diretamente</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwdPWLdfJuzb_gr3vWqn6HAGc1vb-trUWzvIZlIOC6RMmvWRxB6qbNI15gPkWnyzxoSfQ/exec';

    async function buscarLink(slug) {
      const response = await fetch(`${API_URL}?slug=${encodeURIComponent(slug)}`);
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      return data;
    }

    (async function() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      if (!slug) {
        document.getElementById('container').innerHTML = '<p style="text-align:center;padding:40px;">Link inválido</p>';
        return;
      }

      try {
        const link = await buscarLink(slug);
        document.title = link.empresa + ' – Página Oficial';

        // Cabeçalho visual
        const temBanner = link.banner_url && link.banner_url.trim() !== '';
        const temLogo = link.logo_url && link.logo_url.trim() !== '';

        if (temBanner) {
          document.getElementById('bannerImg').src = link.banner_url;
          document.getElementById('bannerDiv').style.display = 'block';
        } else if (temLogo) {
          document.getElementById('logoBannerImg').src = link.logo_url;
          document.getElementById('logoBannerDiv').style.display = 'block';
        } else {
          document.getElementById('colorBannerDiv').style.display = 'block';
        }

        // Logo circular / avatar
        if (temLogo) {
          document.getElementById('logoCircleImg').src = link.logo_url;
          document.getElementById('logoCircle').style.display = 'block';
          document.getElementById('avatarCircle').style.display = 'none';
        } else {
          document.getElementById('avatarLetter').textContent = link.empresa.charAt(0).toUpperCase();
        }

        document.getElementById('empresaNome').textContent = link.empresa;

        if (link.descricao && link.descricao.trim() !== '') {
          document.getElementById('descricaoTexto').textContent = link.descricao;
          document.getElementById('descricaoTexto').style.display = 'block';
        }

        // WhatsApp
        let waNumber = String(link.whatsapp).replace(/\D/g, '');
        if (waNumber.length === 10 || waNumber.length === 11) waNumber = '55' + waNumber;
        let waUrl = 'https://wa.me/' + waNumber;
        if (link.mensagem && link.mensagem.trim() !== '') {
          waUrl += '?text=' + encodeURIComponent(link.mensagem);
        }
        document.getElementById('waLink').href = waUrl;

        document.getElementById('whatsappBtn').addEventListener('click', () => {
          document.getElementById('modalOverlay').style.display = 'flex';
          setTimeout(() => {
            window.open(waUrl, '_blank');
            document.getElementById('modalOverlay').style.display = 'none';
          }, 1800);
        });
        document.getElementById('cancelRedirect').addEventListener('click', () => {
          document.getElementById('modalOverlay').style.display = 'none';
        });

        // Redes sociais
        let temSocial = false;
        if (link.instagram && link.instagram.trim() !== '') {
          document.getElementById('instagramBtn').style.display = 'flex';
          document.getElementById('instagramBtn').addEventListener('click', () => {
            window.open('https://instagram.com/' + link.instagram.replace('@',''), '_blank');
          });
          temSocial = true;
        }
        if (link.facebook && link.facebook.trim() !== '') {
          document.getElementById('facebookBtn').style.display = 'flex';
          document.getElementById('facebookBtn').addEventListener('click', () => {
            window.open(link.facebook, '_blank');
          });
          temSocial = true;
        }
        if (link.site && link.site.trim() !== '') {
          document.getElementById('siteBtn').style.display = 'flex';
          document.getElementById('siteBtn').addEventListener('click', () => {
            window.open(link.site, '_blank');
          });
          temSocial = true;
        }
        if (temSocial) document.getElementById('socialLinks').style.display = 'flex';

        // Localização
        if (link.localizacao && link.localizacao.trim() !== '') {
          document.getElementById('locationBlock').style.display = 'block';
          document.getElementById('mapLink').href = link.localizacao;
          if (link.localizacao.includes('google.com/maps')) {
            document.getElementById('mapIframe').src = link.localizacao.replace('/maps?', '/maps?output=embed&');
          } else {
            document.getElementById('locationBlock').innerHTML = '<a href="' + link.localizacao + '" target="_blank">Ver localização</a>';
          }
        }

        // Horário
        if (link.horario && link.horario.trim() !== '') {
          document.getElementById('horarioBlock').style.display = 'flex';
          document.getElementById('horarioTexto').textContent = link.horario;
        }

      } catch (err) {
        document.getElementById('container').innerHTML = '<p style="text-align:center;padding:40px;">Link não encontrado</p>';
      }
    })();
  </script>
</body>
</html>

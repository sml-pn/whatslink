<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WhatsApp</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#25D366" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2325D366'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/redirect/verde.css" />
  <link rel="stylesheet" href="css/redirect/azul.css" />
  <link rel="stylesheet" href="css/redirect/roxo.css" />
  <link rel="stylesheet" href="css/redirect/laranja.css" />
  <link rel="stylesheet" href="css/redirect/preto.css" />
  <link rel="stylesheet" href="css/redirect/cardapio.css" />
</head>
<body class="reception-body">
  <main class="reception-page theme-verde" id="container">
    <div class="header-visual" id="headerVisual">
      <div class="banner-image" id="bannerDiv" style="display:none"><img id="bannerImg" src="" alt="Banner" /></div>
      <div class="logo-banner" id="logoBannerDiv" style="display:none"><img id="logoBannerImg" src="" alt="Logo" /><div class="glass-overlay"></div></div>
      <div class="color-banner" id="colorBannerDiv" style="display:none"><span class="material-icons-round">storefront</span></div>
    </div>

    <section class="reception-content">
      <div class="logo-circle" id="logoCircle" style="display:none"><img id="logoCircleImg" src="" alt="Logo" /></div>
      <div class="avatar-circle loading-placeholder" id="avatarCircle"><span id="avatarLetter"></span></div>
      <h1 class="company-name loading-placeholder" id="empresaNome"></h1>
      <p class="company-desc" id="descricaoTexto" style="display:none"></p>
      <div class="divider" id="divider" style="display:none"></div>

      <button id="whatsappBtn" class="whatsapp-btn loading-placeholder">
        <span class="whatsapp-icon"><i class="fab fa-whatsapp"></i></span>
        <span id="whatsappBtnText"></span><span class="btn-shine"></span>
      </button>

      <button id="whatsappBtn2" class="whatsapp-btn secondary" style="display:none">
        <span class="whatsapp-icon"><i class="fab fa-whatsapp"></i></span>
        <span id="whatsappBtn2Text"></span>
      </button>

      <div class="social-links" id="socialLinks" style="display:none">
        <button id="instagramBtn" class="social-btn instagram" style="display:none"><i class="fab fa-instagram"></i><span>Instagram</span></button>
        <button id="facebookBtn" class="social-btn facebook" style="display:none"><i class="fab fa-facebook-f"></i><span>Facebook</span></button>
        <button id="siteBtn" class="social-btn site" style="display:none"><span class="material-icons-round">public</span><span>Site</span></button>
      </div>

      <div class="location-block" id="locationBlock" style="display:none">
        <div class="section-label"><span class="material-icons-round">location_on</span><span>Localização</span></div>
        <div class="map-container" id="mapContainer"><iframe id="mapIframe" src="" width="100%" height="220" style="border:0;border-radius:16px;display:block" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
        <a href="#" id="mapLink" target="_blank" rel="noopener noreferrer" class="map-link"><span class="material-icons-round">open_in_new</span><span>Abrir no Google Maps</span></a>
      </div>

      <div class="info-block" id="horarioBlock" style="display:none">
        <div class="info-icon"><span class="material-icons-round">schedule</span></div>
        <div class="info-content"><h3>Horário de atendimento</h3><p id="horarioTexto"></p></div>
      </div>

      <p class="powered-by">Criado com <span class="heart">❤</span> <a href="https://whatslink-48tc.onrender.com/" target="_blank" rel="noopener noreferrer">WhatsLink</a> <span class="dot">•</span> 100% grátis</p>
    </section>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwdPWLdfJuzb_gr3vWqn6HAGc1vb-trUWzvIZlIOC6RMmvWRxB6qbNI15gPkWnyzxoSfQ/exec';
    const THEME_COLORS = { verde:'#25D366', azul:'#3b82f6', roxo:'#8b5cf6', laranja:'#f97316', preto:'#d4af37', cardapio:'#ff8f00' };
    const $ = id => document.getElementById(id);

    function fetchComTimeout(url, options={}, timeout=10000){
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      return fetch(url, {...options, signal: controller.signal}).finally(()=>clearTimeout(timer));
    }
    function removerPlaceholders(){ document.querySelectorAll('.loading-placeholder').forEach(el=>el.classList.remove('loading-placeholder')); }
    function mostrarErro(mensagem){
      removerPlaceholders();
      $('container').innerHTML = `<div class="error-state"><div class="error-icon"><span class="material-icons-round">error_outline</span></div><h2>Link não encontrado</h2><p>${mensagem}</p><a href="/">Ir para página inicial</a></div>`;
    }
    async function buscarLink(slug){
      const res = await fetchComTimeout(`${API_URL}?slug=${encodeURIComponent(slug)}`);
      if(!res.ok) throw new Error('Erro na requisição');
      const text = await res.text(); if(!text) throw new Error('Resposta vazia');
      const data = JSON.parse(text); if(data.error) throw new Error(data.error); return data;
    }
    function detectarTipoLink(url){
      if(!url) return 'vazio';
      if(url.includes('google.com/maps/embed') || url.includes('output=embed')) return 'embed';
      if(url.includes('maps.app.goo.gl') || url.includes('goo.gl/maps')) return 'curto';
      if(url.includes('google.com/maps') || url.includes('google.com.br/maps')) return 'normal';
      return 'outro';
    }
    function criarCardLocalizacao(url, tema){
      return `<div class="location-fallback"><div class="location-fallback-icon"><span class="material-icons-round">location_on</span></div><p>Toque abaixo para visualizar a localização</p><a href="${url}" target="_blank" rel="noopener noreferrer" style="--fallback-theme:${tema}"><span class="material-icons-round">map</span>Abrir no Google Maps</a></div>`;
    }

    (async function init(){
      const slug = new URLSearchParams(window.location.search).get('slug');
      if(!slug){ window.location.href='/'; return; }
      try{
        const link = await buscarLink(slug); removerPlaceholders();
        const tema = link.tema || 'verde';
        $('container').className = 'reception-page theme-' + tema;
        document.querySelector('meta[name="theme-color"]').content = THEME_COLORS[tema] || '#25D366';
        document.title = (link.empresa || 'WhatsApp') + ' | WhatsApp';

        const temBanner = link.banner_url?.trim(), temLogo = link.logo_url?.trim();
        if(temBanner){ $('bannerImg').src = link.banner_url; $('bannerDiv').style.display='block'; }
        else if(temLogo){ $('logoBannerImg').src = link.logo_url; $('logoBannerDiv').style.display='block'; }
        else{ $('colorBannerDiv').style.display='flex'; }

        if(temLogo){ $('logoCircleImg').src = link.logo_url; $('logoCircle').style.display='flex'; $('avatarCircle').style.display='none'; }
        else{ $('avatarLetter').textContent = (link.empresa||'W').charAt(0).toUpperCase(); $('avatarCircle').style.display='flex'; }

        $('empresaNome').textContent = link.empresa || '';
        if(link.descricao?.trim()){ $('descricaoTexto').textContent = link.descricao; $('descricaoTexto').style.display='block'; }
        if(tema==='preto') $('divider').style.display='block';

        let wa = String(link.whatsapp||'').replace(/\D/g,''); if(wa.length===10||wa.length===11) wa='55'+wa;
        let waUrl = 'https://wa.me/'+wa; if(link.mensagem?.trim()) waUrl+='?text='+encodeURIComponent(link.mensagem);
        $('whatsappBtnText').textContent = link.botao_whatsapp?.trim() || 'Falar no WhatsApp';
        $('whatsappBtn').onclick = ()=>window.open(waUrl,'_blank','noopener,noreferrer');

        if(String(link.whatsapp2||'').replace(/\D/g,'')){
          let wa2 = String(link.whatsapp2).replace(/\D/g,''); if(wa2.length===10||wa2.length===11) wa2='55'+wa2;
          let waUrl2 = 'https://wa.me/'+wa2; if(link.mensagem?.trim()) waUrl2+='?text='+encodeURIComponent(link.mensagem);
          $('whatsappBtn2Text').textContent = link.botao_whatsapp2?.trim() || 'Falar no WhatsApp';
          $('whatsappBtn2').style.display='flex';
          $('whatsappBtn2').onclick = ()=>window.open(waUrl2,'_blank','noopener,noreferrer');
        }

        let temSocial=false;
        if(link.instagram?.trim()){ $('instagramBtn').style.display='flex'; $('instagramBtn').onclick=()=>window.open('https://instagram.com/'+link.instagram.replace('@',''),'_blank','noopener,noreferrer'); temSocial=true; }
        if(link.facebook?.trim()){ $('facebookBtn').style.display='flex'; $('facebookBtn').onclick=()=>window.open(link.facebook,'_blank','noopener,noreferrer'); temSocial=true; }
        if(link.site?.trim()){ $('siteBtn').style.display='flex'; $('siteBtn').onclick=()=>window.open(link.site,'_blank','noopener,noreferrer'); temSocial=true; }
        if(temSocial) $('socialLinks').style.display='flex';

        if(link.localizacao?.trim()){
          const locUrl = link.localizacao.trim(); const tipo = detectarTipoLink(locUrl);
          $('locationBlock').style.display='block'; $('mapLink').href=locUrl;
          const mapContainer=$('mapContainer'), mapIframe=$('mapIframe');
          if(tipo==='embed'){ mapIframe.src=locUrl; mapIframe.style.display='block'; }
          else if(tipo==='curto'||tipo==='outro'){ mapIframe.style.display='none'; mapContainer.innerHTML=criarCardLocalizacao(locUrl, THEME_COLORS[tema]); }
          else if(tipo==='normal'){ let e=locUrl; if(!e.includes('output=embed')) e+= (e.includes('?')?'&':'?')+'output=embed'; mapIframe.src=e; mapIframe.style.display='block'; }
        }
        if(link.horario?.trim()){ $('horarioBlock').style.display='flex'; $('horarioTexto').textContent=link.horario; }
      }catch(err){ mostrarErro(err.message||'Link não encontrado'); }
    })();
  </script>
</body>
</html>

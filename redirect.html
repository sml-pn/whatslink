<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WhatsApp</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#25D366" id="themeColorMeta" />
  <meta name="color-scheme" content="dark" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2325D366'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/base.css" />

  <!-- CRITICAL CSS - Robusto / Anti-FOUC / Anti-CLS -->
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{width:100%;max-width:100%;margin:0;padding:0;overflow-x:clip;background:#050507}
    body{min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
   .reception-page{width:100%;max-width:520px;margin:0 auto;isolation:isolate}
   .loading-placeholder{
      position:relative; overflow:hidden; opacity:.9; pointer-events:none; user-select:none;
      background:#1c1c22!important; color:transparent!important; border-color:transparent!important; border-radius:12px;
    }
   .loading-placeholder::after{
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
      transform:translateX(-100%); animation:shimmer 1.4s infinite linear;
    }
    @keyframes shimmer{to{transform:translateX(100%)}}
    img{max-width:100%; display:block}
    [hidden]{display:none!important}
  </style>
</head>
<body class="reception-body">
  <main class="reception-page theme-verde" id="container" aria-live="polite">
    <div class="header-visual" id="headerVisual">
      <div class="banner-image" id="bannerDiv" style="display:none"><img id="bannerImg" src="" alt="Banner da empresa" decoding="async" /></div>
      <div class="logo-banner" id="logoBannerDiv" style="display:none"><img id="logoBannerImg" src="" alt="Logo da empresa" decoding="async" /><div class="glass-overlay" aria-hidden="true"></div></div>
      <div class="color-banner" id="colorBannerDiv" style="display:none" aria-hidden="true"><span class="material-icons-round">storefront</span></div>
    </div>

    <section class="reception-content">
      <div class="logo-circle" id="logoCircle" style="display:none"><img id="logoCircleImg" src="" alt="Logo" /></div>
      <div class="avatar-circle loading-placeholder" id="avatarCircle" aria-hidden="true"><span id="avatarLetter"></span></div>

      <h1 class="company-name loading-placeholder" id="empresaNome"></h1>
      <p class="company-desc" id="descricaoTexto" style="display:none"></p>
      <div class="divider" id="divider" style="display:none" aria-hidden="true"></div>

      <button id="whatsappBtn" type="button" class="whatsapp-btn loading-placeholder" aria-label="Falar no WhatsApp">
        <span class="whatsapp-icon" aria-hidden="true"><i class="fab fa-whatsapp"></i></span>
        <span id="whatsappBtnText"></span><span class="btn-shine" aria-hidden="true"></span>
      </button>

      <button id="whatsappBtn2" type="button" class="whatsapp-btn secondary" style="display:none" aria-label="Falar no segundo WhatsApp">
        <span class="whatsapp-icon" aria-hidden="true"><i class="fab fa-whatsapp"></i></span>
        <span id="whatsappBtn2Text"></span>
      </button>

      <div class="social-links" id="socialLinks" style="display:none">
        <button id="instagramBtn" type="button" class="social-btn instagram" style="display:none"><i class="fab fa-instagram"></i><span>Instagram</span></button>
        <button id="facebookBtn" type="button" class="social-btn facebook" style="display:none"><i class="fab fa-facebook-f"></i><span>Facebook</span></button>
        <button id="siteBtn" type="button" class="social-btn site" style="display:none"><span class="material-icons-round">public</span><span>Site</span></button>
      </div>

      <div class="location-block" id="locationBlock" style="display:none">
        <div class="section-label"><span class="material-icons-round">location_on</span><span>Localização</span></div>
        <div class="map-container" id="mapContainer"><iframe id="mapIframe" title="Mapa" src="" width="100%" height="220" style="border:0;border-radius:16px;display:block" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
        <a href="#" id="mapLink" target="_blank" rel="noopener noreferrer" class="map-link"><span class="material-icons-round">open_in_new</span><span>Abrir no Google Maps</span></a>
      </div>

      <div class="info-block" id="horarioBlock" style="display:none">
        <div class="info-icon"><span class="material-icons-round">schedule</span></div>
        <div class="info-content"><h3>Horário de atendimento</h3><p id="horarioTexto"></p></div>
      </div>

      <p class="powered-by">Criado com <span class="heart">❤</span> <a href="https://whatslink-48tc.onrender.com/" target="_blank" rel="noopener noreferrer">WhatsLink</a> <span class="dot">•</span> 100% grátis</p>
    </section>
  </main>

  <noscript><style>.loading-placeholder::after{display:none}</style><p style="color:#fff;text-align:center;padding:20px">Ative o JavaScript para visualizar este link.</p></noscript>

<script>
(() => {
  'use strict';

  const CONFIG = {
    API_URL: 'https://script.google.com/macros/s/AKfycbwdPWLdfJuzb_gr3vWqn6HAGc1vb-trUWzvIZlIOC6RMmvWRxB6qbNI15gPkWnyzxoSfQ/exec',
    TIMEOUT: 10000,
    THEMES: ['verde','azul','roxo','laranja','preto','cardapio'],
    COLORS: { verde:'#25D366', azul:'#3b82f6', roxo:'#8b5cf6', laranja:'#f97316', preto:'#d4af37', cardapio:'#ff8f00' },
    DEFAULT_THEME: 'verde'
  };

  const $ = id => document.getElementById(id);
  const safeText = (el, text) => { if(el) el.textContent = text?? ''; };
  const escapeHtml = str => String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  function fetchWithTimeout(url, options={}, timeout=CONFIG.TIMEOUT){
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), timeout);
    return fetch(url,{...options, signal:controller.signal}).finally(()=>clearTimeout(timer));
  }

  async function fetchWithRetry(url, retries=1){
    for(let i=0;i<=retries;i++){
      try{
        const res = await fetchWithTimeout(url);
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        return res;
      }catch(err){
        if(i===retries) throw err;
        if(err.name==='AbortError') throw new Error('Tempo esgotado. Verifique sua conexão.');
        await new Promise(r=>setTimeout(r, 600));
      }
    }
  }

  function loadThemeCss(tema){
    return new Promise((resolve)=>{
      const safeTema = CONFIG.THEMES.includes(tema)? tema : CONFIG.DEFAULT_THEME;
      const href = `css/redirect/${safeTema}.css`;
      if(document.querySelector(`link[href="${href}"]`)) return resolve(safeTema);
      document.querySelectorAll('link[data-theme-css]').forEach(el=>el.remove());
      const link = document.createElement('link');
      link.rel='stylesheet'; link.href=href; link.dataset.themeCss='true';
      link.onload=()=>resolve(safeTema);
      link.onerror=()=>{
        if(safeTema!==CONFIG.DEFAULT_THEME) loadThemeCss(CONFIG.DEFAULT_THEME).then(resolve);
        else resolve(CONFIG.DEFAULT_THEME);
      };
      document.head.appendChild(link);
    });
  }

  function removePlaceholders(){ document.querySelectorAll('.loading-placeholder').forEach(el=>el.classList.remove('loading-placeholder')); }

  function showError(msg){
    removePlaceholders();
    $('container').innerHTML = `<div class="error-state"><div class="error-icon"><span class="material-icons-round">error_outline</span></div><h2>Link não encontrado</h2><p>${escapeHtml(msg)}</p><a href="/">Ir para página inicial</a></div>`;
  }

  async function getLinkData(slug){
    const res = await fetchWithRetry(`${CONFIG.API_URL}?slug=${encodeURIComponent(slug)}`);
    const text = await res.text();
    if(!text) throw new Error('Resposta vazia da API');
    let data;
    try{ data = JSON.parse(text); }catch{ throw new Error('Resposta inválida da API'); }
    if(data.error) throw new Error(data.error);
    return data;
  }

  function detectMapType(url){
    if(!url) return 'vazio';
    if(url.includes('google.com/maps/embed')||url.includes('output=embed')) return 'embed';
    if(url.includes('maps.app.goo.gl')||url.includes('goo.gl/maps')) return 'curto';
    if(url.includes('google.com/maps')||url.includes('google.com.br/maps')) return 'normal';
    return 'outro';
  }

  function createLocationCard(url, color){
    return `<div class="location-fallback"><div class="location-fallback-icon"><span class="material-icons-round">location_on</span></div><p>Toque abaixo para visualizar a localização</p><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" style="--fallback-theme:${color}"><span class="material-icons-round">map</span>Abrir no Google Maps</a></div>`;
  }

  function formatZap(num){
    let v = String(num||'').replace(/\D/g,'');
    if(v.length===10||v.length===11) v='55'+v;
    return v;
  }

  function buildWaUrl(number, message){
    if(!number) return null;
    let url = `https://wa.me/${number}`;
    if(message?.trim()) url+=`?text=${encodeURIComponent(message.trim())}`;
    return url;
  }

  async function init(){
    const slug = new URLSearchParams(location.search).get('slug')?.trim();
    if(!slug){ location.replace('/'); return; }
    if(slug.length>120){ showError('Slug inválido'); return; }

    try{
      const link = await getLinkData(slug);
      const temaRaw = (link.tema||'').toLowerCase().trim();
      const tema = CONFIG.THEMES.includes(temaRaw)? temaRaw : CONFIG.DEFAULT_THEME;

      await loadThemeCss(tema);
      removePlaceholders();

      $('container').className = `reception-page theme-${tema}`;
      $('themeColorMeta').content = CONFIG.COLORS[tema] || CONFIG.COLORS.verde;
      document.title = `${(link.empresa||'WhatsApp').trim()} | WhatsApp`;

      // Banner / Logo com fallback robusto
      const temBanner =!!link.banner_url?.trim();
      const temLogo =!!link.logo_url?.trim();
      const bannerImg = $('bannerImg'), logoBannerImg = $('logoBannerImg');

      const showColorBanner = () => { $('colorBannerDiv').style.display='flex'; };

      if(temBanner){
        bannerImg.onerror = showColorBanner;
        bannerImg.src = link.banner_url.trim();
        $('bannerDiv').style.display='block';
      } else if(temLogo){
        logoBannerImg.onerror = showColorBanner;
        logoBannerImg.src = link.logo_url.trim();
        $('logoBannerDiv').style.display='block';
      } else {
        showColorBanner();
      }

      // Avatar circular
      if(temLogo){
        const circleImg = $('logoCircleImg');
        circleImg.onerror = () => {
          $('logoCircle').style.display='none';
          $('avatarLetter').textContent = (link.empresa||'W').charAt(0).toUpperCase();
          $('avatarCircle').style.display='flex';
        };
        circleImg.src = link.logo_url.trim();
        $('logoCircle').style.display='flex';
        $('avatarCircle').style.display='none';
      } else {
        safeText($('avatarLetter'), (link.empresa||'W').charAt(0).toUpperCase());
        $('avatarCircle').style.display='flex';
      }

      safeText($('empresaNome'), link.empresa || '');
      if(link.descricao?.trim()){ safeText($('descricaoTexto'), link.descricao.trim()); $('descricaoTexto').style.display='block'; }
      if(tema==='preto') $('divider').style.display='block';

      // WhatsApp Principal
      const waNum = formatZap(link.whatsapp);
      const waUrl = buildWaUrl(waNum, link.mensagem);
      if(!waUrl) throw new Error('Número de WhatsApp inválido');
      safeText($('whatsappBtnText'), link.botao_whatsapp?.trim() || 'Falar no WhatsApp');
      $('whatsappBtn').addEventListener('click', ()=>window.open(waUrl,'_blank','noopener,noreferrer'));

      // WhatsApp 2
      if(String(link.whatsapp2||'').replace(/\D/g,'').length>=10){
        const wa2Num = formatZap(link.whatsapp2);
        const wa2Url = buildWaUrl(wa2Num, link.mensagem);
        if(wa2Url){
          safeText($('whatsappBtn2Text'), link.botao_whatsapp2?.trim() || 'Falar no WhatsApp');
          $('whatsappBtn2').style.display='flex';
          $('whatsappBtn2').addEventListener('click', ()=>window.open(wa2Url,'_blank','noopener,noreferrer'));
        }
      }

      // Sociais
      let hasSocial=false;
      if(link.instagram?.trim()){
        $('instagramBtn').style.display='flex';
        const clean = link.instagram.trim().replace('@','').replace(/[^a-zA-Z0-9._]/g,'');
        $('instagramBtn').addEventListener('click', ()=>window.open(`https://instagram.com/${clean}`,'_blank','noopener,noreferrer'));
        hasSocial=true;
      }
      if(link.facebook?.trim()){
        try{ new URL(link.facebook.trim()); $('facebookBtn').style.display='flex'; $('facebookBtn').addEventListener('click', ()=>window.open(link.facebook.trim(),'_blank','noopener,noreferrer')); hasSocial=true; }catch{}
      }
      if(link.site?.trim()){
        try{ new URL(link.site.trim()); $('siteBtn').style.display='flex'; $('siteBtn').addEventListener('click', ()=>window.open(link.site.trim(),'_blank','noopener,noreferrer')); hasSocial=true; }catch{}
      }
      if(hasSocial) $('socialLinks').style.display='flex';

      // Localização
      if(link.localizacao?.trim()){
        const locUrl = link.localizacao.trim();
        try{
          // valida se é URL
          new URL(locUrl);
          $('locationBlock').style.display='block';
          $('mapLink').href = locUrl;
          const type = detectMapType(locUrl);
          const iframe = $('mapIframe'), container = $('mapContainer');
          if(type==='embed'){ iframe.src=locUrl; iframe.style.display='block'; }
          else if(type==='curto'||type==='outro'){ iframe.style.display='none'; container.innerHTML=createLocationCard(locUrl, CONFIG.COLORS[tema]); }
          else{ let e=locUrl; if(!e.includes('output=embed')) e+=(e.includes('?')?'&':'?')+'output=embed'; iframe.src=e; iframe.style.display='block'; }
        }catch{}
      }

      if(link.horario?.trim()){ $('horarioBlock').style.display='flex'; safeText($('horarioTexto'), link.horario.trim()); }

    }catch(err){
      showError(err.message||'Link não encontrado');
    }
  }

  init();
})();
</script>
</body>
</html>

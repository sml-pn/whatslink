<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WhatsApp</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#25D366" id="themeColorMeta" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2325D366'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root { --theme:#25D366; --theme-dark:#128C7E; --theme-rgb:37,211,102; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; background:#08080a; overflow-x:hidden; }
    body { font-family:'Outfit',sans-serif; color:#fff; min-height:100dvh; display:flex; justify-content:center; -webkit-font-smoothing:antialiased; }
    .reception-body {
      background:
        radial-gradient(600px circle at 0% 0%, rgba(var(--theme-rgb),.15), transparent 40%),
        radial-gradient(800px circle at 100% 100%, rgba(var(--theme-rgb),.08), transparent),
        #08080a;
    }
    .reception-page {
      width:100%; max-width:480px; min-height:100dvh; margin:0 auto;
      background:#111113; position:relative; display:flex; flex-direction:column;
      opacity:0; transform:scale(.95); transition: opacity .4s ease, transform .4s cubic-bezier(.2,.8,.2,1);
    }
    .reception-page.loaded {
      opacity:1; transform:scale(1);
    }
    @media(min-width:600px) {
      .reception-page { margin:32px auto; min-height:auto; border-radius:32px; border:1px solid rgba(255,255,255,.06); box-shadow:0 20px 80px rgba(0,0,0,.6); }
    }
    .loading-placeholder { position:relative; overflow:hidden; background:#1a1a1e!important; color:transparent!important; border-color:transparent!important; }
    .loading-placeholder::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent); transform:translateX(-100%); animation:shimmer 1.2s infinite; }
    @keyframes shimmer { to { transform:translateX(100%); } }
    .hidden { display:none !important; }

    /* Overlay de carregamento */
    #loading-overlay {
      position:fixed; inset:0; z-index:9999; background:#08080a;
      display:flex; align-items:center; justify-content:center;
      transition: opacity .3s ease, visibility .3s ease;
    }
    #loading-overlay.fade-out { opacity:0; visibility:hidden; pointer-events:none; }
    .spinner {
      width:50px; height:50px; border-radius:50%;
      border:4px solid rgba(255,255,255,.1);
      border-top-color: var(--theme, #25D366);
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="reception-body">
  <!-- Overlay de carregamento -->
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <main class="reception-page theme-verde" id="container">
    <!-- Camadas de efeito -->
    <div class="fog-layer" aria-hidden="true"></div>
    <div class="dust-layer" aria-hidden="true"></div>
    <!-- Camadas extras para temas específicos podem ser adicionadas via CSS -->

    <div class="header-visual" id="headerVisual">
      <div class="banner-image hidden" id="bannerDiv"><img id="bannerImg" src="" alt="Banner" loading="eager" decoding="async" /></div>
      <div class="color-banner hidden" id="colorBannerDiv"><span class="material-icons-round">storefront</span></div>
    </div>

    <section class="reception-content" id="receptionContent">
      <div class="logo-circle hidden" id="logoCircle">
        <img id="logoCircleImg" src="" alt="Logo" loading="eager" decoding="async" />
      </div>
      <div class="avatar-circle loading-placeholder hidden" id="avatarCircle">
        <span id="avatarLetter"></span>
      </div>

      <h1 class="company-name loading-placeholder" id="empresaNome"></h1>
      <p class="company-desc hidden" id="descricaoTexto"></p>
      <div class="divider hidden" id="divider"></div>

      <button id="whatsappBtn" type="button" class="whatsapp-btn loading-placeholder">
        <span class="whatsapp-icon"><i class="fab fa-whatsapp"></i></span>
        <span id="whatsappBtnText"></span>
        <span class="btn-shine"></span>
      </button>
      <button id="whatsappBtn2" type="button" class="whatsapp-btn secondary hidden">
        <span class="whatsapp-icon"><i class="fab fa-whatsapp"></i></span>
        <span id="whatsappBtn2Text"></span>
      </button>

      <div class="social-links hidden" id="socialLinks">
        <button id="instagramBtn" type="button" class="social-btn hidden"><i class="fab fa-instagram"></i><span>Instagram</span></button>
        <button id="facebookBtn" type="button" class="social-btn hidden"><i class="fab fa-facebook-f"></i><span>Facebook</span></button>
        <button id="siteBtn" type="button" class="social-btn hidden"><span class="material-icons-round">public</span><span>Site</span></button>
      </div>

      <div class="location-block hidden" id="locationBlock">
        <div class="section-label"><span class="material-icons-round">location_on</span><span>Localização</span></div>
        <div class="map-container" id="mapContainer"><iframe id="mapIframe" title="Mapa" src="" width="100%" height="200" style="border:0" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
        <a href="#" id="mapLink" target="_blank" rel="noopener noreferrer" class="map-link"><span class="material-icons-round">open_in_new</span>Abrir no Maps</a>
      </div>

      <div class="info-block hidden" id="horarioBlock">
        <div class="info-icon"><span class="material-icons-round">schedule</span></div>
        <div class="info-content"><h3>Horário</h3><p id="horarioTexto"></p></div>
      </div>

      <p class="powered-by">Feito com <span class="heart">♥</span> <a href="https://whatslink-48tc.onrender.com/" target="_blank" rel="noopener noreferrer">WhatsLink</a></p>
    </section>
  </main>

  <script>
    'use strict';

    const CONFIG = {
      API_URL: 'https://script.google.com/macros/s/AKfycbwdPWLdfJuzb_gr3vWqn6HAGc1vb-trUWzvIZlIOC6RMmvWRxB6qbNI15gPkWnyzxoSfQ/exec',
      TIMEOUT_MS: 10000,
      MAX_RETRIES: 3,
      CACHE_DURATION_MS: 5 * 60 * 1000,
      THEMES: ['verde', 'azul', 'roxo', 'laranja', 'preto', 'cardapio'],
      DEFAULT_THEME: 'verde',
      THEME_COLORS: { verde:'#25D366', azul:'#3b82f6', roxo:'#8b5cf6', laranja:'#f97316', preto:'#d4af37', cardapio:'#ff8f00' },
      THEME_RGB: { verde:'37,211,102', azul:'59,130,246', roxo:'139,92,246', laranja:'249,115,22', preto:'212,175,55', cardapio:'255,143,0' }
    };

    const $ = id => document.getElementById(id);
    const $$ = selector => [...document.querySelectorAll(selector)];

    function log(level, message, data = null) {
      const prefix = `[WhatsLink] [${level.toUpperCase()}]`;
      if (data) console[level](prefix, message, data);
      else console[level](prefix, message);
    }

    function sanitizeString(value, maxLength = 500) {
      if (value === null || value === undefined) return '';
      return String(value).trim().slice(0, maxLength);
    }

    function sanitizeUrl(url) {
      if (!url) return '';
      const trimmed = String(url).trim();
      if (!trimmed) return '';
      try {
        const parsed = new URL(trimmed);
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return trimmed;
      } catch (e) {}
      return '';
    }

    function formatarWhatsApp(numero) {
      let v = String(numero || '').replace(/\D/g, '');
      if (v.length >= 10 && v.length <= 11) v = '55' + v;
      return v;
    }

    function isValidWhatsApp(numero) {
      const v = formatarWhatsApp(numero);
      return v.length >= 12 && v.length <= 13;
    }

    function detectarTipoLink(url) {
      if (!url) return 'vazio';
      if (url.includes('/embed') || url.includes('output=embed')) return 'embed';
      if (url.includes('goo.gl') || url.includes('maps.app.goo.gl')) return 'curto';
      if (url.includes('google.com/maps') || url.includes('google.com.br/maps')) return 'normal';
      return 'outro';
    }

    function criarCardLocalizacao(url, cor) {
      return `
        <div class="location-fallback">
          <div class="location-fallback-icon"><span class="material-icons-round">location_on</span></div>
          <p>Ver no Google Maps</p>
          <a href="${url}" target="_blank" rel="noopener noreferrer" style="background:${cor}"><span class="material-icons-round">map</span>Abrir Maps</a>
        </div>`;
    }

    function isValidTheme(tema) {
      return CONFIG.THEMES.includes(tema);
    }

    // Cache
    function getCachedData(slug) {
      try {
        const cacheKey = `whatslink_cache_${slug}`;
        const cached = localStorage.getItem(cacheKey);
        if (!cached) return null;
        const { data, timestamp } = JSON.parse(cached);
        if (Date.now() - timestamp > CONFIG.CACHE_DURATION_MS) {
          localStorage.removeItem(cacheKey);
          return null;
        }
        return data;
      } catch (e) { return null; }
    }

    function setCachedData(slug, data) {
      try {
        localStorage.setItem(`whatslink_cache_${slug}`, JSON.stringify({ data, timestamp: Date.now() }));
      } catch (e) {}
    }

    function carregarCssTema(tema) {
      if (!isValidTheme(tema)) tema = CONFIG.DEFAULT_THEME;
      $$('link[data-theme-css]').forEach(el => el.remove());
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `css/redirect/${tema}.css`;
      link.dataset.themeCss = 'true';
      link.onerror = () => {
        log('error', `Falha ao carregar CSS do tema: ${tema}`);
        if (tema !== CONFIG.DEFAULT_THEME) carregarCssTema(CONFIG.DEFAULT_THEME);
      };
      document.head.appendChild(link);
    }

    async function fetchWithRetry(url, options = {}, retries = CONFIG.MAX_RETRIES) {
      for (let attempt = 1; attempt <= retries; attempt++) {
        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), CONFIG.TIMEOUT_MS);
          const response = await fetch(url, { ...options, signal: controller.signal });
          clearTimeout(timeout);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response;
        } catch (error) {
          log('warn', `Tentativa ${attempt} falhou: ${error.message}`);
          if (attempt === retries) throw new Error('Não foi possível conectar ao servidor');
          await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
        }
      }
    }

    async function buscarLink(slug) {
      const cached = getCachedData(slug);
      if (cached) { log('info', 'Dados carregados do cache'); return cached; }
      const response = await fetchWithRetry(`${CONFIG.API_URL}?slug=${encodeURIComponent(slug)}`);
      const text = await response.text();
      if (!text) throw new Error('Resposta vazia');
      let data;
      try { data = JSON.parse(text); } catch (e) { throw new Error('Resposta inválida'); }
      if (data.error) throw new Error(data.error);
      setCachedData(slug, data);
      return data;
    }

    function removeLoaders() {
      $$('.loading-placeholder').forEach(el => el.classList.remove('loading-placeholder'));
    }

    function showError(message) {
      removeLoaders();
      const container = $('container');
      container.innerHTML = `
        <div class="error-state">
          <div class="error-icon"><span class="material-icons-round">error_outline</span></div>
          <h2>Link não encontrado</h2>
          <p>${message}</p>
          <a href="/">Voltar</a>
        </div>`;
    }

    function renderizarHeader(data, container, tema) {
      const temBanner = sanitizeUrl(data.banner_url) !== '';
      const temLogo = sanitizeUrl(data.logo_url) !== '';

      // Limpa
      $('headerVisual').classList.add('hidden');
      $('bannerDiv').classList.add('hidden');
      $('colorBannerDiv').classList.add('hidden');
      $('logoCircle').classList.add('hidden');
      $('avatarCircle').classList.add('hidden');
      container.classList.remove('no-banner', 'has-banner');

      if (temBanner) {
        $('headerVisual').classList.remove('hidden');
        $('bannerDiv').classList.remove('hidden');
        $('bannerImg').src = sanitizeUrl(data.banner_url);
        if (temLogo) {
          $('logoCircleImg').src = sanitizeUrl(data.logo_url);
          $('logoCircle').classList.remove('hidden');
        } else {
          $('avatarLetter').textContent = (data.empresa || 'W').charAt(0).toUpperCase();
          $('avatarCircle').classList.remove('hidden');
        }
        container.classList.add('has-banner');
      } else {
        container.classList.add('no-banner');
        if (temLogo) {
          $('logoCircleImg').src = sanitizeUrl(data.logo_url);
          $('logoCircle').classList.remove('hidden');
        } else {
          $('avatarLetter').textContent = (data.empresa || 'W').charAt(0).toUpperCase();
          $('avatarCircle').classList.remove('hidden');
        }
      }
    }

    function renderizarWhatsApp(data) {
      if (isValidWhatsApp(data.whatsapp)) {
        const wa1 = formatarWhatsApp(data.whatsapp);
        let url1 = `https://wa.me/${wa1}`;
        if (data.mensagem) url1 += `?text=${encodeURIComponent(data.mensagem)}`;
        $('whatsappBtnText').textContent = sanitizeString(data.botao_whatsapp, 50) || 'Falar no WhatsApp';
        $('whatsappBtn').onclick = () => window.open(url1, '_blank', 'noopener,noreferrer');
      } else {
        $('whatsappBtnText').textContent = 'WhatsApp indisponível';
      }

      if (isValidWhatsApp(data.whatsapp2)) {
        const wa2 = formatarWhatsApp(data.whatsapp2);
        let url2 = `https://wa.me/${wa2}`;
        if (data.mensagem) url2 += `?text=${encodeURIComponent(data.mensagem)}`;
        $('whatsappBtn2Text').textContent = sanitizeString(data.botao_whatsapp2, 50) || 'Falar no WhatsApp';
        $('whatsappBtn2').classList.remove('hidden');
        $('whatsappBtn2').onclick = () => window.open(url2, '_blank', 'noopener,noreferrer');
      }
    }

    function renderizarRedesSociais(data) {
      let temSocial = false;
      if (data.instagram) {
        $('instagramBtn').classList.remove('hidden');
        $('instagramBtn').onclick = () => window.open(`https://instagram.com/${data.instagram.replace('@','').trim()}`, '_blank');
        temSocial = true;
      }
      if (sanitizeUrl(data.facebook)) {
        $('facebookBtn').classList.remove('hidden');
        $('facebookBtn').onclick = () => window.open(sanitizeUrl(data.facebook), '_blank');
        temSocial = true;
      }
      if (sanitizeUrl(data.site)) {
        $('siteBtn').classList.remove('hidden');
        $('siteBtn').onclick = () => window.open(sanitizeUrl(data.site), '_blank');
        temSocial = true;
      }
      if (temSocial) $('socialLinks').classList.remove('hidden');
    }

    function renderizarLocalizacao(data, tema) {
      if (!data.localizacao) return;
      const locUrl = sanitizeUrl(data.localizacao) || data.localizacao.trim();
      const tipo = detectarTipoLink(locUrl);
      $('locationBlock').classList.remove('hidden');
      $('mapLink').href = locUrl;
      if (tipo === 'embed') {
        $('mapIframe').src = locUrl;
        $('mapIframe').style.display = 'block';
      } else if (tipo === 'curto' || tipo === 'outro') {
        $('mapIframe').style.display = 'none';
        $('mapContainer').innerHTML = criarCardLocalizacao(locUrl, CONFIG.THEME_COLORS[tema]);
      } else {
        let embedUrl = locUrl;
        if (!embedUrl.includes('output=embed')) embedUrl += (embedUrl.includes('?') ? '&' : '?') + 'output=embed';
        $('mapIframe').src = embedUrl;
        $('mapIframe').style.display = 'block';
      }
    }

    function renderizarHorario(data) {
      if (!data.horario) return;
      $('horarioBlock').classList.remove('hidden');
      $('horarioTexto').textContent = sanitizeString(data.horario, 300);
    }

    function renderizarPagina(data) {
      const slug = new URLSearchParams(location.search).get('slug')?.trim();
      const tema = isValidTheme(data.tema) ? data.tema : CONFIG.DEFAULT_THEME;

      carregarCssTema(tema);
      document.documentElement.style.setProperty('--theme', CONFIG.THEME_COLORS[tema]);
      document.documentElement.style.setProperty('--theme-rgb', CONFIG.THEME_RGB[tema]);
      $('container').className = `reception-page theme-${tema}`;
      $('themeColorMeta').content = CONFIG.THEME_COLORS[tema];
      document.title = `${sanitizeString(data.empresa, 60) || 'WhatsApp'} | WhatsApp`;

      renderizarHeader(data, $('container'), tema);
      $('empresaNome').textContent = sanitizeString(data.empresa, 100) || 'WhatsApp';
      if (data.descricao) { $('descricaoTexto').textContent = sanitizeString(data.descricao, 500); $('descricaoTexto').classList.remove('hidden'); }
      if (tema === 'preto') $('divider').classList.remove('hidden');
      renderizarWhatsApp(data);
      renderizarRedesSociais(data);
      renderizarLocalizacao(data, tema);
      renderizarHorario(data);
      removeLoaders();

      // Ativa animação de aparição
      requestAnimationFrame(() => {
        $('container').classList.add('loaded');
        // Esconde overlay de carregamento
        const overlay = $('loading-overlay');
        if (overlay) overlay.classList.add('fade-out');
      });
    }

    (async function init() {
      try {
        const slug = new URLSearchParams(location.search).get('slug')?.trim();
        if (!slug) { location.replace('/'); return; }
        const data = await buscarLink(slug);
        renderizarPagina(data);
      } catch (error) {
        log('error', 'Falha ao carregar link', error);
        showError(error.message || 'Não foi possível carregar este link');
        // Mesmo em erro, esconder overlay
        const overlay = $('loading-overlay');
        if (overlay) overlay.classList.add('fade-out');
      }
    })();
  </script>
</body>
</html>

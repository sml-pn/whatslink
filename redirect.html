<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WhatsApp</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#25D366" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2325D366'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E" />
  
  <!-- Fontes e ícones -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- CSS BASE (comum a todos) -->
  <link rel="stylesheet" href="css/base.css" />
  
  <!-- RESET CRÍTICO E PLACEHOLDER -->
  <style>
    html, body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #050507;
    }
    body {
      display: block;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .reception-page {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }
    .loading-placeholder {
      opacity: 0.4;
      background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

<body class="reception-body">
  <main class="reception-page" id="container">
    <!-- HEADER / BANNER -->
    <div class="header-visual" id="headerVisual">
      <div class="banner-image" id="bannerDiv" style="display:none;">
        <img id="bannerImg" src="" alt="Banner" />
      </div>
      <div class="logo-banner" id="logoBannerDiv" style="display:none;">
        <img id="logoBannerImg" src="" alt="Logo" />
        <div class="glass-overlay"></div>
      </div>
      <div class="color-banner" id="colorBannerDiv" style="display:none;">
        <span class="material-icons-round">storefront</span>
      </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <section class="reception-content">
      <!-- LOGO -->
      <div class="logo-circle" id="logoCircle" style="display:none;">
        <img id="logoCircleImg" src="" alt="Logo" />
      </div>
      <div class="avatar-circle loading-placeholder" id="avatarCircle">
        <span id="avatarLetter"></span>
      </div>
      <h1 class="company-name loading-placeholder" id="empresaNome"></h1>
      <p class="company-desc" id="descricaoTexto" style="display:none;"></p>
      <div class="divider" id="divider" style="display:none;"></div>

      <!-- WHATSAPP PRINCIPAL -->
      <button id="whatsappBtn" class="whatsapp-btn loading-placeholder">
        <span class="whatsapp-icon"><i class="fab fa-whatsapp"></i></span>
        <span id="whatsappBtnText"></span>
        <span class="btn-shine"></span>
      </button>

      <!-- WHATSAPP SECUNDÁRIO -->
      <button id="whatsappBtn2" class="whatsapp-btn secondary" style="display:none;">
        <span class="whatsapp-icon"><i class="fab fa-whatsapp"></i></span>
        <span id="whatsappBtn2Text"></span>
      </button>

      <!-- REDES SOCIAIS -->
      <div class="social-links" id="socialLinks" style="display:none;">
        <button id="instagramBtn" class="social-btn instagram" style="display:none;">
          <i class="fab fa-instagram"></i><span>Instagram</span>
        </button>
        <button id="facebookBtn" class="social-btn facebook" style="display:none;">
          <i class="fab fa-facebook-f"></i><span>Facebook</span>
        </button>
        <button id="siteBtn" class="social-btn site" style="display:none;">
          <span class="material-icons-round">public</span><span>Site</span>
        </button>
      </div>

      <!-- LOCALIZAÇÃO -->
      <div class="location-block" id="locationBlock" style="display:none;">
        <div class="section-label">
          <span class="material-icons-round">location_on</span>
          <span>Localização</span>
        </div>
        <div class="map-container" id="mapContainer">
          <iframe id="mapIframe" src="" width="100%" height="220"
            style="border:0; border-radius:16px; display:block;"
            loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>
        <a href="#" id="mapLink" target="_blank" rel="noopener noreferrer" class="map-link">
          <span class="material-icons-round">open_in_new</span>
          <span>Abrir no Google Maps</span>
        </a>
      </div>

      <!-- HORÁRIO -->
      <div class="info-block" id="horarioBlock" style="display:none;">
        <div class="info-icon"><span class="material-icons-round">schedule</span></div>
        <div class="info-content">
          <h3>Horário de atendimento</h3>
          <p id="horarioTexto"></p>
        </div>
      </div>

      <!-- ASSINATURA -->
      <p class="powered-by">
        Criado com <span class="heart">❤️</span>
        <a href="https://whatslink-48tc.onrender.com/" target="_blank" rel="noopener noreferrer">WhatsLink</a>
        <span class="dot">•</span> 100% grátis
      </p>
    </section>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwdPWLdfJuzb_gr3vWqn6HAGc1vb-trUWzvIZlIOC6RMmvWRxB6qbNI15gPkWnyzxoSfQ/exec';
    const BASE_URL = 'https://whatslink-48tc.onrender.com/redirect.html?slug=';

    // ============ AUXILIARES ============
    function fetchComTimeout(url, options = {}, timeout = 10000) {
      return Promise.race([
        fetch(url, options),
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Tempo esgotado. Tente novamente.')), timeout)
        )
      ]);
    }

    function removerPlaceholders() {
      document.querySelectorAll('.loading-placeholder').forEach(el => {
        el.classList.remove('loading-placeholder');
      });
    }

    function mostrarErro(mensagem) {
      removerPlaceholders();
      document.getElementById('container').innerHTML = `
        <div class="error-state">
          <div class="error-icon">
            <span class="material-icons-round">error_outline</span>
          </div>
          <h2>Link não encontrado</h2>
          <p>${mensagem}</p>
          <a href="/">Ir para página inicial</a>
        </div>`;
    }

    function detectarTipoLink(url) {
      if (!url) return 'vazio';
      if (url.includes('google.com/maps/embed') || url.includes('output=embed')) return 'embed';
      if (url.includes('maps.app.goo.gl') || url.includes('goo.gl/maps')) return 'curto';
      if (url.includes('google.com/maps') || url.includes('google.com.br/maps')) return 'normal';
      return 'outro';
    }

    function criarCardLocalizacao(url, tema) {
      return `
        <div class="location-fallback">
          <div class="location-fallback-icon">
            <span class="material-icons-round">location_on</span>
          </div>
          <p>Toque abaixo para visualizar a localização</p>
          <a href="${url}" target="_blank" rel="noopener noreferrer" style="--fallback-theme:${tema}">
            <span class="material-icons-round">map</span>
            Abrir no Google Maps
          </a>
        </div>`;
    }

    // ============ BUSCAR LINK ============
    async function buscarLink(slug) {
      const response = await fetchComTimeout(`${API_URL}?slug=${encodeURIComponent(slug)}`);
      if (!response.ok) throw new Error('Erro na requisição');
      const text = await response.text();
      if (!text) throw new Error('Resposta vazia');
      const data = JSON.parse(text);
      if (data.error) throw new Error(data.error);
      return data;
    }

    // ============ CARREGAR CSS DO TEMA ============
    function carregarCssTema(tema) {
      // Remove qualquer CSS de tema anterior (exceto base.css)
      document.querySelectorAll('link[data-theme-css]').forEach(el => el.remove());
      
      // Cria e adiciona o link do tema
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `css/redirect/${tema}.css`;
      link.dataset.themeCss = 'true';
      document.head.appendChild(link);
      
      console.log(`🎨 Tema "${tema}" carregado.`);
    }

    // ============ EXECUTAR ============
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) {
        window.location.href = '/';
        return;
      }

      try {
        const link = await buscarLink(slug);
        removerPlaceholders();

        const tema = link.tema || 'verde';
        const container = document.getElementById('container');
        
        // Aplica a classe do tema
        container.className = `reception-page theme-${tema}`;
        
        // Carrega o CSS do tema
        carregarCssTema(tema);

        // Muda a cor do theme-color
        const coresTema = {
          verde: '#25D366', azul: '#3b82f6', roxo: '#8b5cf6',
          laranja: '#f97316', preto: '#d4af37', cardapio: '#ff8f00'
        };
        const corTema = coresTema[tema] || '#25D366';
        document.querySelector('meta[name="theme-color"]').content = corTema;

        document.title = (link.empresa || 'WhatsApp') + ' | WhatsApp';

        // ===== PREENCHER DADOS =====
        const temBanner = link.banner_url && link.banner_url.trim() !== '';
        const temLogo = link.logo_url && link.logo_url.trim() !== '';

        if (temBanner) {
          document.getElementById('bannerImg').src = link.banner_url;
          document.getElementById('bannerDiv').style.display = 'block';
        } else if (temLogo) {
          document.getElementById('logoBannerImg').src = link.logo_url;
          document.getElementById('logoBannerDiv').style.display = 'block';
        } else {
          document.getElementById('colorBannerDiv').style.display = 'flex';
        }

        if (temLogo) {
          document.getElementById('logoCircleImg').src = link.logo_url;
          document.getElementById('logoCircle').style.display = 'flex';
          document.getElementById('avatarCircle').style.display = 'none';
        } else {
          document.getElementById('avatarLetter').textContent =
            (link.empresa || 'W').charAt(0).toUpperCase();
          document.getElementById('avatarCircle').style.display = 'flex';
        }

        document.getElementById('empresaNome').textContent = link.empresa || '';

        if (link.descricao && link.descricao.trim() !== '') {
          document.getElementById('descricaoTexto').textContent = link.descricao;
          document.getElementById('descricaoTexto').style.display = 'block';
        }

        if (tema === 'preto' || tema === 'cardapio') {
          document.getElementById('divider').style.display = 'block';
        }

        // WhatsApp principal
        let waNumber = String(link.whatsapp || '').replace(/\D/g, '');
        if (waNumber.length === 10 || waNumber.length === 11) waNumber = '55' + waNumber;
        let waUrl = 'https://wa.me/' + waNumber;
        if (link.mensagem && link.mensagem.trim() !== '') {
          waUrl += '?text=' + encodeURIComponent(link.mensagem);
        }

        const botaoPrincipal = link.botao_whatsapp && link.botao_whatsapp.trim() !== ''
          ? link.botao_whatsapp : 'Falar no WhatsApp';
        document.getElementById('whatsappBtnText').textContent = botaoPrincipal;
        document.getElementById('whatsappBtn').addEventListener('click', function() {
          window.open(waUrl, '_blank', 'noopener,noreferrer');
        });

        // WhatsApp secundário
        if (link.whatsapp2 && String(link.whatsapp2).replace(/\D/g, '') !== '') {
          let waNumber2 = String(link.whatsapp2).replace(/\D/g, '');
          if (waNumber2.length === 10 || waNumber2.length === 11) waNumber2 = '55' + waNumber2;
          let waUrl2 = 'https://wa.me/' + waNumber2;
          if (link.mensagem && link.mensagem.trim() !== '') {
            waUrl2 += '?text=' + encodeURIComponent(link.mensagem);
          }
          const texto2 = link.botao_whatsapp2 && link.botao_whatsapp2.trim() !== ''
            ? link.botao_whatsapp2 : 'Falar no WhatsApp';
          document.getElementById('whatsappBtn2Text').textContent = texto2;
          document.getElementById('whatsappBtn2').style.display = 'flex';
          document.getElementById('whatsappBtn2').addEventListener('click', function() {
            window.open(waUrl2, '_blank', 'noopener,noreferrer');
          });
        }

        // Redes sociais
        let temSocial = false;
        if (link.instagram && link.instagram.trim() !== '') {
          document.getElementById('instagramBtn').style.display = 'flex';
          document.getElementById('instagramBtn').onclick = function() {
            window.open('https://instagram.com/' + link.instagram.replace('@', ''), '_blank', 'noopener,noreferrer');
          };
          temSocial = true;
        }
        if (link.facebook && link.facebook.trim() !== '') {
          document.getElementById('facebookBtn').style.display = 'flex';
          document.getElementById('facebookBtn').onclick = function() {
            window.open(link.facebook, '_blank', 'noopener,noreferrer');
          };
          temSocial = true;
        }
        if (link.site && link.site.trim() !== '') {
          document.getElementById('siteBtn').style.display = 'flex';
          document.getElementById('siteBtn').onclick = function() {
            window.open(link.site, '_blank', 'noopener,noreferrer');
          };
          temSocial = true;
        }
        if (temSocial) document.getElementById('socialLinks').style.display = 'flex';

        // Localização
        if (link.localizacao && link.localizacao.trim() !== '') {
          const locUrl = link.localizacao.trim();
          const tipoLink = detectarTipoLink(locUrl);
          document.getElementById('locationBlock').style.display = 'block';
          document.getElementById('mapLink').href = locUrl;
          const mapContainer = document.getElementById('mapContainer');
          const mapIframe = document.getElementById('mapIframe');

          if (tipoLink === 'embed') {
            mapIframe.src = locUrl;
            mapIframe.style.display = 'block';
          } else if (tipoLink === 'curto' || tipoLink === 'outro') {
            mapIframe.style.display = 'none';
            mapContainer.innerHTML = criarCardLocalizacao(locUrl, corTema);
          } else {
            let embedUrl = locUrl;
            if (!embedUrl.includes('output=embed')) {
              embedUrl = embedUrl + (embedUrl.includes('?') ? '&' : '?') + 'output=embed';
            }
            mapIframe.src = embedUrl;
            mapIframe.style.display = 'block';
          }
        }

        // Horário
        if (link.horario && link.horario.trim() !== '') {
          document.getElementById('horarioBlock').style.display = 'flex';
          document.getElementById('horarioTexto').textContent = link.horario;
        }

        console.log('✅ Página carregada com tema:', tema);

      } catch (err) {
        mostrarErro(err.message || 'Link não encontrado');
      }
    })();
  </script>
</body>
</html>

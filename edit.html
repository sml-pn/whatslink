<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Links - WhatsLink</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/edit.css" />
</head>
<body>
  <!-- NAVBAR -->
  <header class="main-header">
    <a href="index.html" class="logo">
      <div class="logo-icon"><span class="material-icons-round">link</span></div>
      Whats<span>Link</span>
    </a>
    <a href="index.html" class="back-link">
      <span class="material-icons-round" style="font-size:18px;">arrow_back</span>
      Voltar para página inicial
    </a>
  </header>

  <div class="edit-container">
    <!-- LOGIN -->
    <div class="login-box" id="loginCard">
      <h2>🔐 Entre para editar seus links</h2>
      <p>Use sua conta Google para acessar</p>
      <div id="g_id_onload" data-client_id="324848509089-gler91lhlck949jpektatrr8ute1mslf.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
    </div>

    <!-- USUÁRIO LOGADO -->
    <div id="userArea" style="display:none;">
      <div class="user-area">
        <img id="userPhoto" src="" alt="Foto" />
        <span id="userName"></span>
        <button class="logout-btn" id="logoutBtn">
          <span class="material-icons-round" style="font-size:18px;">logout</span>
          Sair
        </button>
      </div>
    </div>

    <!-- LISTA DE LINKS -->
    <div id="linksArea" style="display:none;">
      <h2 style="margin-bottom:16px;">Meus Links</h2>
      <div id="linksList"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwdPWLdfJuzb_gr3vWqn6HAGc1vb-trUWzvIZlIOC6RMmvWRxB6qbNI15gPkWnyzxoSfQ/exec';
    let currentUser = null;

    function showToast(msg, icon = 'check_circle') {
      const t = document.getElementById('toast');
      if (!t) return;
      t.innerHTML = `<span class="material-icons-round">${icon}</span> ${msg}`;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function handleCredentialResponse(response) {
      try {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        currentUser = {
          email: payload.email,
          nome: payload.name,
          foto: payload.picture
        };
        localStorage.setItem('whatslink_user', JSON.stringify(currentUser));
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('userArea').style.display = 'block';
        document.getElementById('userPhoto').src = currentUser.foto;
        document.getElementById('userName').textContent = currentUser.nome;
        buscarMeusLinks();
      } catch (err) {
        showToast('Erro ao fazer login', 'error');
      }
    }

    async function buscarMeusLinks() {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'buscar_meus_links', email: currentUser.email })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error);

        const links = data.links || [];
        const linksList = document.getElementById('linksList');

        if (links.length === 0) {
          linksList.innerHTML = `
            <div class="empty-state">
              <span class="material-icons-round">link_off</span>
              <p>Você ainda não criou nenhum link.</p>
              <a href="/" style="color:#25D366; font-weight:600;">Criar meu primeiro link →</a>
            </div>
          `;
        } else {
          linksList.innerHTML = links.map(link => `
            <div class="link-card">
              <div>
                <h3>${link.empresa}</h3>
                <p>whatslink-48tc.onrender.com/${link.slug} • ${link.cliques} cliques</p>
              </div>
              <a class="btn btn-view" href="https://whatslink-48tc.onrender.com/redirect.html?slug=${link.slug}" target="_blank">
                <span class="material-icons-round" style="font-size:16px;">visibility</span>
                Ver
              </a>
            </div>
          `).join('');
        }

        document.getElementById('linksArea').style.display = 'block';
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('whatslink_user');
      currentUser = null;
      document.getElementById('userArea').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('linksArea').style.display = 'none';
    });

    const savedUser = localStorage.getItem('whatslink_user');
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('userArea').style.display = 'block';
      document.getElementById('userPhoto').src = currentUser.foto;
      document.getElementById('userName').textContent = currentUser.nome;
      buscarMeusLinks();
    }
  </script>
</body>
</html>
